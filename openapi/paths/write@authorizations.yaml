get:
  summary: Get write authorizations for authenticated user
  description: |-
    Returns the storage locations and permissions available to the authenticated user
    for write operations. This should be called before attempting to create or update objects
    to determine which storage locations are accessible.
  operationId: GetWriteAuthorizations
  tags:
    - Objects
  responses:
    '200':
      description: Write authorizations successfully retrieved
      content:
        application/json:
          schema:
            $ref: '../components/schemas/WriteAuthorizations.yaml'
    '401':
      $ref: '../components/responses/401Unauthorized.yaml'
    '500':
      $ref: '../components/responses/500InternalServerError.yaml'
  security:
    - BearerAuth: []
    - BasicAuth: []