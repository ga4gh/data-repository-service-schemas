get:
  summary: List DRS objects
  description: >-
    **Optional Endpoint**: Not all DRS servers support object listing.

    List and filter DRS objects known to the server. This is a server-side
    discovery capability that complements the bulk `POST /objects` operation
    (which requires known object IDs).

    Results can be filtered by tag using the `tag_key` and `tag_value` query
    parameters. Provide one or more `tag_key` values (optionally zipped with
    `tag_value` values) to match objects whose tags contain all of the
    specified key/value pairs. A provided `tag_key` with an empty `tag_value`
    matches any value for that key.

    Results are paginated. If more results are available, the response
    contains a `next_page_token` that can be passed in the `page_token`
    query parameter of a subsequent request.

    **Authentication**: A valid GA4GH Passport may be provided, or a bearer
    token in the header.
  operationId: ListObjects
  security:
    - {}
    - BasicAuth: []
    - BearerAuth: []
    - PassportAuth: []
  parameters:
    - $ref: '../components/parameters/tag_key.yaml'
    - $ref: '../components/parameters/tag_value.yaml'
    - $ref: '../components/parameters/page_size.yaml'
    - $ref: '../components/parameters/page_token.yaml'
  responses:
    200:
      $ref: '../components/responses/200ListObjects.yaml'
    400:
      $ref: '../components/responses/400BadRequest.yaml'
    401:
      $ref: '../components/responses/401Unauthorized.yaml'
    403:
      $ref: '../components/responses/403Forbidden.yaml'
    413:
      $ref: '../components/responses/413RequestTooLarge.yaml'
    500:
      $ref: '../components/responses/500InternalServerError.yaml'
  tags:
    - Objects
  x-swagger-router-controller: ga4gh.drs.server

options:
  summary: Get Authorization info about multiple DrsObjects.
  security:
    - {}
  description: >-
    Returns a structure that contains for each DrsObjects a list of `Authorizations` that can be used to determine how to authorize requests to `GetObject` or `PostObject` (or bulk equivalents).
  operationId: OptionsBulkObject
  responses:
    200:
      $ref: '../components/responses/200OkBulkAuthorizations.yaml'
    204:
      $ref: '../components/responses/AuthorizationsNotSupported.yaml'
    400:
      $ref: '../components/responses/400BadRequest.yaml'
    404:
      $ref: '../components/responses/404NotFoundDrsObject.yaml'
    405:
      $ref: '../components/responses/AuthorizationsNotSupported.yaml'
    413:
      $ref: '../components/responses/413RequestTooLarge.yaml'
    500:
      $ref: '../components/responses/500InternalServerError.yaml'
  tags:
    - Objects
  x-swagger-router-controller: ga4gh.drs.server
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/parameters/BulkObjectIdNoPassport.yaml'

post:
  summary: Get info about multiple DrsObjects with an optional Passport(s).
  description: >-
    Returns an array of object metadata and access methods for the specified object IDs.
    
    The request is limited to use passports (one or more) or a single bearer token, 
    so make sure your bulk request is for objects that all use the same passports/token.
    
    **Note**: To register new DRS objects, use the dedicated `/objects/register` endpoint.
  operationId: GetBulkObjects
  security:
    - PassportAuth: []
  parameters:
    - $ref: '../components/parameters/Expand.yaml'
  responses:
    200:
      $ref: '../components/responses/200OkDrsObjects.yaml'
    202:
      $ref: '../components/responses/202Accepted.yaml'
    400:
      $ref: '../components/responses/400BadRequest.yaml'
    401:
      $ref: '../components/responses/401Unauthorized.yaml'
    403:
      $ref: '../components/responses/403Forbidden.yaml'
    404:
      $ref: '../components/responses/404NotFoundDrsObject.yaml'
    413:
      $ref: '../components/responses/413RequestTooLarge.yaml'
    500:
      $ref: '../components/responses/500InternalServerError.yaml'
  tags:
    - Objects
  x-swagger-router-controller: ga4gh.drs.server
  requestBody:
    $ref: '../components/requestBodies/BulkObjectBody.yaml'