options:
  summary: Get Authorization info about multiple DrsObjects.
  security:
    - {}
  description: >-
    Returns a structure that contains for each DrsObjects a list of `Authorizations` that can be used to determine how to authorize requests to `GetObject` or `PostObject` (or bulk equivalents).
  operationId: OptionsBulkObject
  responses:
    200:
      $ref: '../components/responses/200OkBulkAuthorizations.yaml'
    204:
      $ref: '../components/responses/AuthorizationsNotSupported.yaml'
    400:
      $ref: '../components/responses/400BadRequest.yaml'
    404:
      $ref: '../components/responses/404NotFoundDrsObject.yaml'
    405:
      $ref: '../components/responses/AuthorizationsNotSupported.yaml'
    413:
      $ref: '../components/responses/413RequestTooLarge.yaml'
    500:
      $ref: '../components/responses/500InternalServerError.yaml'
  tags:
    - Objects
  x-swagger-router-controller: ga4gh.drs.server
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/parameters/BulkObjectIdNoPassport.yaml'

post:
  summary: Get info about multiple DrsObjects with an optional Passport(s).
  description: >-
    Returns an array of object metadata and access methods for the specified object IDs.
    
    The request is limited to use passports (one or more) or a single bearer token, 
    so make sure your bulk request is for objects that all use the same passports/token.
    
    **Note**: To register new DRS objects, use the dedicated `/objects/register` endpoint.
  operationId: GetBulkObjects
  security:
    - PassportAuth: []
  parameters:
    - $ref: '../components/parameters/Expand.yaml'
  responses:
    200:
      $ref: '../components/responses/200OkDrsObjects.yaml'
    202:
      $ref: '../components/responses/202Accepted.yaml'
    400:
      $ref: '../components/responses/400BadRequest.yaml'
    401:
      $ref: '../components/responses/401Unauthorized.yaml'
    403:
      $ref: '../components/responses/403Forbidden.yaml'
    404:
      $ref: '../components/responses/404NotFoundDrsObject.yaml'
    413:
      $ref: '../components/responses/413RequestTooLarge.yaml'
    500:
      $ref: '../components/responses/500InternalServerError.yaml'
  tags:
    - Objects
  x-swagger-router-controller: ga4gh.drs.server
  requestBody:
    $ref: '../components/requestBodies/BulkObjectBody.yaml'

put:
  summary: Update DRS objects by adding or removing access method mirrors
  description: >-
    **Optional Endpoint**: This endpoint is not required for DRS server implementations.
    Not all DRS servers support object updates.

    Updates one or more existing DRS objects by adding or removing access methods (mirrors).
    This endpoint is primarily used to add additional cloud/region file upload locations or
    remove existing mirrors. The underlying file content (checksums) MUST remain unchanged.

    **Important Constraints**:
    - Files CANNOT change their checksums or point to files with different checksums
    - Only access methods (mirrors) can be added or removed
    - All mirrors must point to the same file content verified by matching checksums
    - Metadata updates (name, description, aliases) are allowed

    **Use Cases**:
    - Add mirrors in different cloud providers or regions for better geographic distribution
    - Remove access methods that are no longer available or needed
    - Update metadata like description or aliases without changing file content

    **Transactional Behavior**:
    Like registration, updates SHOULD be atomic. If ANY object update fails validation,
    the ENTIRE request SHOULD fail and NO objects SHOULD be updated.

    **Authentication**: GA4GH Passports can be provided in the request body for authorization.
  operationId: UpdateObjects
  security:
    - {}
    - BasicAuth: []
    - BearerAuth: []
    - PassportAuth: []
  requestBody:
    $ref: '../components/requestBodies/UpdateObjectsBody.yaml'
  responses:
    200:
      $ref: '../components/responses/200ObjectsUpdated.yaml'
    400:
      $ref: '../components/responses/400BadRequest.yaml'
    401:
      $ref: '../components/responses/401Unauthorized.yaml'
    403:
      $ref: '../components/responses/403Forbidden.yaml'
    404:
      $ref: '../components/responses/404NotFoundDrsObject.yaml'
    409:
      description: Conflict - checksum mismatch detected
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Error.yaml'
    413:
      $ref: '../components/responses/413RequestTooLarge.yaml'
    500:
      $ref: '../components/responses/500InternalServerError.yaml'
  tags:
    - Objects
  x-swagger-router-controller: ga4gh.drs.server