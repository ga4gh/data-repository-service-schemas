post:
  summary: Request additional upload URLs
  description: |-
    Request an upload URL for an additional storage location for a pending DRS object.
    This allows uploading the same object to multiple locations before finalizing.
    Can only be used when the object is in 'pending' state.
  operationId: RequestUploadURL
  tags:
    - Objects
  parameters:
    - $ref: '../components/parameters/ObjectId.yaml'
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../components/schemas/UploadURLRequest.yaml'
    required: true
  responses:
    '200':
      description: Upload URL successfully generated
      content:
        application/json:
          schema:
            $ref: '../components/schemas/UploadURLResponse.yaml'
    '400':
      $ref: '../components/responses/400BadRequest.yaml'
    '401':
      $ref: '../components/responses/401Unauthorized.yaml'
    '403':
      $ref: '../components/responses/403Forbidden.yaml'
    '404':
      $ref: '../components/responses/404NotFoundDrsObject.yaml'
    '409':
      description: Object is not in a state that allows additional upload URLs
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Error.yaml'
    '500':
      $ref: '../components/responses/500InternalServerError.yaml'
  security:
    - BearerAuth: []
    - BasicAuth: []