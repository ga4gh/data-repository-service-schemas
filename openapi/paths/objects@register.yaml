post:
  summary: Register DRS objects (optional endpoint)
  description: >-
    **Optional Endpoint**: This endpoint is not required for DRS server implementations. 
    Not all DRS servers support object registration.    

    Registers one or more "candidate" DRS objects with the server. If it accepts the request, the server will create 
    unique object IDs for each registered object and return them in fully-formed DRS objects in response.
    
    This endpoint can be used after uploading files using methods negotiated with the `/upload-request` endpoint 
    to register the uploaded files as DRS objects, or to register existinf data. The request body should contain candidate 
    DRS objects with all required metadata including access methods that correspond 
    to the upload methods used during file upload.
    
    **RECOMMENDED - Transactional Behavior**: 
    Registration operations SHOULD be atomic transactions. If ANY candidate object fails validation 
    or registration, the ENTIRE request SHOULD fail and NO objects SHOULD be registered. Servers SHOULD 
    implement this as an all-or-nothing operation to ensure data consistency, but MAY implement partial 
    registration with appropriate error reporting if transactional behavior is not feasible.
    
    **Authentication**: GA4GH Passports can be provided in the request body for authorization.
    
    **Server Responsibilities**:
    - SHOULD treat registration as an atomic transaction (all succeed or all fail)
    - SHOULD validate ALL candidate objects before registering ANY
    - Create unique object IDs for each registered object
    - Add timestamps (created_time, updated_time)
    - SHOULD roll back any partial changes if any candidate fails validation
    
    **Client Responsibilities**:
    - Provide required DRS object metadata for all candidates
    - Include access methods corresponding to uploaded file locations
    - Ensure checksums match uploaded file content
    - Handle potential failure of entire batch if any single object is invalid
  operationId: RegisterObjects
  security:
    - {}
    - BasicAuth: []
    - BearerAuth: []
    - PassportAuth: []
  requestBody:
    $ref: '../components/requestBodies/RegisterObjectsBody.yaml'
  responses:
    201:
      $ref: '../components/responses/201ObjectsCreated.yaml'
    400:
      $ref: '../components/responses/400BadRequest.yaml'
    401:
      $ref: '../components/responses/401Unauthorized.yaml'
    403:
      $ref: '../components/responses/403Forbidden.yaml'
    413:
      $ref: '../components/responses/413RequestTooLarge.yaml'
    500:
      $ref: '../components/responses/500InternalServerError.yaml'
  tags:
    - Objects
  x-swagger-router-controller: ga4gh.drs.server
  x-codegen-request-body-name: body