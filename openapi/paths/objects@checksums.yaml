put:
  summary: Add additional checksums for multiple DRS objects
  description: Add checksums to several DRS objects in a single atomic request. This is an optional endpoint that not all DRS servers implement.
  operationId: BulkAddChecksums
  requestBody:
    $ref: '../components/requestBodies/BulkChecksumAdditionBody.yaml'
  responses:
    '200':
      $ref: '../components/responses/200BulkChecksumAddition.yaml'
    '400':
      $ref: '../components/responses/400BadRequest.yaml'
    '401':
      $ref: '../components/responses/401Unauthorized.yaml'
    '403':
      $ref: '../components/responses/403Forbidden.yaml'
    '404':
      $ref: '../components/responses/404NotFoundDrsObject.yaml'
    '413':
      $ref: '../components/responses/413RequestTooLarge.yaml'
    '500':
      $ref: '../components/responses/500InternalServerError.yaml'
  security:
    - {}
    - BasicAuth: []
    - BearerAuth: []
    - PassportAuth: []
  tags:
    - Objects
