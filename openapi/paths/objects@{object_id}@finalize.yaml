post:
  summary: Finalize a DRS object after upload
  description: |-
    Mark a DRS object as finalized after successful upload(s) to storage location(s).
    The server will verify checksums and transition the object to 'available' state.
    Access methods will be populated based on uploaded locations.
  operationId: FinalizeObject
  tags:
    - Objects
  parameters:
    - $ref: '../components/parameters/ObjectId.yaml'
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../components/schemas/FinalizeObjectRequest.yaml'
    required: true
  responses:
    '200':
      description: The DRS object was successfully finalized and is now available
      content:
        application/json:
          schema:
            $ref: '../components/schemas/DrsObject.yaml'
    '400':
      $ref: '../components/responses/400BadRequest.yaml'
    '401':
      $ref: '../components/responses/401Unauthorized.yaml'
    '403':
      $ref: '../components/responses/403Forbidden.yaml'
    '404':
      $ref: '../components/responses/404NotFoundDrsObject.yaml'
    '409':
      description: Object is not in a state that can be finalized
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Error.yaml'
    '422':
      description: Checksum verification failed or other validation error
      content:
        application/json:
          schema:
            $ref: '../components/schemas/Error.yaml'
    '500':
      $ref: '../components/responses/500InternalServerError.yaml'
  security:
    - BearerAuth: []
    - BasicAuth: []