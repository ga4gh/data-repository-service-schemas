options:
  summary: Get Authorization info about a DrsObject.
  security:
    - {}
  description: >-
    Returns a list of `Authorizations` that can be used to determine how to authorize requests to `GetObject` or `PostObject`.
  operationId: OptionsObject
  parameters:
    - $ref: '../components/parameters/ObjectId.yaml'
  responses:
    200:
      $ref: '../components/responses/200OkAuthorizations.yaml'
    204:
      $ref: '../components/responses/AuthorizationsNotSupported.yaml'
    400:
      $ref: '../components/responses/400BadRequest.yaml'
    404:
      $ref: '../components/responses/404NotFoundDrsObject.yaml'
    405:
      $ref: '../components/responses/AuthorizationsNotSupported.yaml'
    500:
      $ref: '../components/responses/500InternalServerError.yaml'
  tags:
    - Objects
  x-swagger-router-controller: ga4gh.drs.server

get:
  summary: Get info about a DrsObject.
  description: >-
    Returns object metadata, and a list of access methods that can be used to fetch object bytes.
  operationId: GetObject
  parameters:
    - $ref: '../components/parameters/ObjectId.yaml'
    - $ref: '../components/parameters/Expand.yaml'
  responses:
    200:
      $ref: '../components/responses/200OkDrsObject.yaml'
    202:
      $ref: '../components/responses/202Accepted.yaml'
    400:
      $ref: '../components/responses/400BadRequest.yaml'
    401:
      $ref: '../components/responses/401Unauthorized.yaml'
    403:
      $ref: '../components/responses/403Forbidden.yaml'
    404:
      $ref: '../components/responses/404NotFoundDrsObject.yaml'
    500:
      $ref: '../components/responses/500InternalServerError.yaml'
  tags:
    - Objects
  x-swagger-router-controller: ga4gh.drs.server

post:
  summary: Get info about a DrsObject through POST'ing a Passport.
  description: >-
    Returns object metadata and a list of access methods that can be used to fetch object bytes.
    Method is a POST to accommodate a JWT GA4GH Passport sent in the request body in order to authorize access.
    
    To upload new files and register them as DRS objects, use the `/upload-request` endpoint 
    to obtain upload methods and temporary credentials, then use POST `/objects/register` endpoint 
    to register multiple objects at once. Note that upload functionality is optional and not all DRS 
    servers implement the upload endpoints.
  operationId: PostObject
  security:
    - PassportAuth: []
  responses:
    200:
      $ref: '../components/responses/200OkDrsObject.yaml'
    202:
      $ref: '../components/responses/202Accepted.yaml'
    400:
      $ref: '../components/responses/400BadRequest.yaml'
    401:
      $ref: '../components/responses/401Unauthorized.yaml'
    403:
      $ref: '../components/responses/403Forbidden.yaml'
    404:
      $ref: '../components/responses/404NotFoundAccess.yaml'
    500:
      $ref: '../components/responses/500InternalServerError.yaml'
  tags:
    - Objects
  x-swagger-router-controller: ga4gh.drs.server
  parameters:
    - $ref: '../components/parameters/ObjectId.yaml'
  requestBody:
    $ref: '../components/requestBodies/PostObjectBody.yaml'
delete:
  summary: Delete a DRS object without a Passport (optional endpoint)
  description: >-
    Delete a single DRS object by ID, using Basic or Bearer authentication, with the
    delete options as query parameters. This is an optional endpoint that not all DRS
    servers implement. To delete with a GA4GH Passport, which is sent in a request body,
    use PUT `/objects/{object_id}/delete` instead.
  operationId: DeleteObject
  security:
    - BasicAuth: []
    - BearerAuth: []
  parameters:
    - $ref: '../components/parameters/ObjectId.yaml'
    - $ref: '../components/parameters/DeleteStorageData.yaml'
    - $ref: '../components/parameters/DeleteObjectMetadata.yaml'
  responses:
    204:
      $ref: '../components/responses/204DeleteSuccess.yaml'
    400:
      $ref: '../components/responses/400BadRequestDelete.yaml'
    401:
      $ref: '../components/responses/401Unauthorized.yaml'
    403:
      $ref: '../components/responses/403ForbiddenDelete.yaml'
    404:
      $ref: '../components/responses/404NotFoundDelete.yaml'
    500:
      $ref: '../components/responses/500InternalServerError.yaml'
  tags:
    - Objects
  x-swagger-router-controller: ga4gh.drs.server
