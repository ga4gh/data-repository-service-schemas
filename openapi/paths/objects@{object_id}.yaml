options:
  summary: Get Authorization info about a DrsObject.
  security:
    - {}
  description: >-
    Returns a list of `Authorizations` that can be used to determine how to authorize requests to `GetObject` or `PostObject`.
  operationId: OptionsObject
  parameters:
    - $ref: '../components/parameters/ObjectId.yaml'
  responses:
    200:
      $ref: '../components/responses/200OkAuthorizations.yaml'
    204:
      $ref: '../components/responses/AuthorizationsNotSupported.yaml'
    400:
      $ref: '../components/responses/400BadRequest.yaml'
    404:
      $ref: '../components/responses/404NotFoundDrsObject.yaml'
    405:
      $ref: '../components/responses/AuthorizationsNotSupported.yaml'
    500:
      $ref: '../components/responses/500InternalServerError.yaml'
  tags:
    - Objects
  x-swagger-router-controller: ga4gh.drs.server

get:
  summary: Get info about a DrsObject.
  description: >-
    Returns object metadata, and a list of access methods that can be used to fetch object bytes.
  operationId: GetObject
  parameters:
    - $ref: '../components/parameters/ObjectId.yaml'
    - $ref: '../components/parameters/Expand.yaml'
  responses:
    200:
      $ref: '../components/responses/200OkDrsObject.yaml'
    202:
      $ref: '../components/responses/202Accepted.yaml'
    400:
      $ref: '../components/responses/400BadRequest.yaml'
    401:
      $ref: '../components/responses/401Unauthorized.yaml'
    403:
      $ref: '../components/responses/403Forbidden.yaml'
    404:
      $ref: '../components/responses/404NotFoundDrsObject.yaml'
    500:
      $ref: '../components/responses/500InternalServerError.yaml'
  tags:
    - Objects
  x-swagger-router-controller: ga4gh.drs.server

post:
  summary: Get info about a DrsObject through POST'ing a Passport.
  description: >-
    Returns object metadata, and a list of access methods that can be used to fetch object bytes.

    Method is a POST to accommodate a JWT GA4GH Passport sent in the formData in order to authorize access.
  operationId: PostObject
  security:
    - PassportAuth: []
  responses:
    200:
      $ref: '../components/responses/200OkDrsObject.yaml'
    202:
      $ref: '../components/responses/202Accepted.yaml'
    400:
      $ref: '../components/responses/400BadRequest.yaml'
    401:
      $ref: '../components/responses/401Unauthorized.yaml'
    403:
      $ref: '../components/responses/403Forbidden.yaml'
    404:
      $ref: '../components/responses/404NotFoundAccess.yaml'
    500:
      $ref: '../components/responses/500InternalServerError.yaml'
  tags:
    - Objects
  x-swagger-router-controller: ga4gh.drs.server
  parameters:
    - $ref: '../components/parameters/ObjectId.yaml'
  requestBody:
    $ref: '../components/requestBodies/PostObjectBody.yaml'

put:
  summary: Update a DRS object
  description: |-
    Update a DRS object's metadata. If size, checksums, or target_storage_location are changed,
    this triggers a content update and the object will transition to 'pending' state with new upload URLs provided.
    Metadata-only updates (name, description, etc.) do not change the object state.
  operationId: UpdateObject
  tags:
    - Objects
  parameters:
    - $ref: '../components/parameters/ObjectId.yaml'
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../components/schemas/UpdateObjectRequest.yaml'
    required: true
  responses:
    '200':
      description: The DRS object was successfully updated (metadata only)
      content:
        application/json:
          schema:
            $ref: '../components/schemas/DrsObject.yaml'
    '201':
      description: The DRS object update requires content change - upload URL provided
      content:
        application/json:
          schema:
            $ref: '../components/schemas/CreateObjectResponse.yaml'
    '400':
      $ref: '../components/responses/400BadRequest.yaml'
    '401':
      $ref: '../components/responses/401Unauthorized.yaml'
    '403':
      $ref: '../components/responses/403Forbidden.yaml'
    '404':
      $ref: '../components/responses/404NotFoundDrsObject.yaml'
    '413':
      $ref: '../components/responses/413RequestTooLarge.yaml'
    '500':
      $ref: '../components/responses/500InternalServerError.yaml'
  security:
    - BearerAuth: []
    - BasicAuth: []

delete:
  summary: Delete a DRS object
  description: |-
    Delete a DRS object and all associated data from storage locations.
    This operation is irreversible.
  operationId: DeleteObject
  tags:
    - Objects
  parameters:
    - $ref: '../components/parameters/ObjectId.yaml'
  responses:
    '204':
      description: The DRS object was successfully deleted
    '401':
      $ref: '../components/responses/401Unauthorized.yaml'
    '403':
      $ref: '../components/responses/403Forbidden.yaml'
    '404':
      $ref: '../components/responses/404NotFoundDrsObject.yaml'
    '500':
      $ref: '../components/responses/500InternalServerError.yaml'
  security:
    - BearerAuth: []
    - BasicAuth: []
