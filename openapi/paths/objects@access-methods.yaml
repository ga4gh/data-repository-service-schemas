post:
  summary: Bulk update access methods for multiple DRS objects
  description: >-
    **Optional Endpoint**: Not all DRS servers support access method updates.
    
    Update access methods for multiple DRS objects in a single atomic transaction. 
    If ANY object fails to update, the ENTIRE request fails and NO objects are updated.
    Only access methods are modified - core object metadata remains unchanged.

    Note that existing access methods are overwritten, if clients want to add additional 
    access methods they should first retrieve the current methods and include them along
    with the new methods in this request.
    
    **Authentication**: GA4GH Passports can be provided in the request body.
  operationId: bulkUpdateAccessMethods
  requestBody:
    $ref: '../components/requestBodies/BulkAccessMethodUpdateBody.yaml'
  responses:
    '200':
      $ref: '../components/responses/200BulkAccessMethodUpdate.yaml'
    '400':
      $ref: '../components/responses/400BadRequest.yaml'
    '401':
      $ref: '../components/responses/401Unauthorized.yaml'
    '403':
      $ref: '../components/responses/403Forbidden.yaml'
    '404':
      $ref: '../components/responses/404NotFoundDrsObject.yaml'
    '413':
      $ref: '../components/responses/413RequestTooLarge.yaml'
    '500':
      $ref: '../components/responses/500InternalServerError.yaml'
  security:
    - {}
    - BasicAuth: []
    - BearerAuth: []
    - PassportAuth: []
  tags:
    - Objects