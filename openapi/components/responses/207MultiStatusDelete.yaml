description: Multi-status response for bulk delete operations with mixed results.
content:
  application/json:
    schema:
      $ref: '../schemas/BulkDeleteResponse.yaml'
    examples:
      mixed_results:
        summary: Mixed success and failure results
        description: Some objects deleted successfully, others failed due to various reasons
        value:
          results:
            - object_id: "drs_object_123456"
              status: 204
              message: "Successfully deleted"
            - object_id: "drs_object_789012"
              status: 404
              message: "Object not found"
              error:
                msg: "DRS object drs_object_789012 does not exist"
                status_code: 404
            - object_id: "drs_object_345678"
              status: 403
              message: "Insufficient permissions"
              error:
                msg: "Client lacks delete permission for object drs_object_345678"
                status_code: 403
      partial_success:
        summary: Partial success with storage deletion failures
        description: Metadata deleted but some storage data deletion failed
        value:
          results:
            - object_id: "drs_object_123456"
              status: 204
              message: "Successfully deleted metadata and storage data"
            - object_id: "drs_object_789012"
              status: 204
              message: "Metadata deleted, storage data deletion failed"
            - object_id: "drs_object_345678"
              status: 204
              message: "Successfully deleted metadata and storage data"