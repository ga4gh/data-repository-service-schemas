description: Successfully updated DRS objects
content:
  application/json:
    schema:
      type: object
      required:
        - objects
      properties:
        objects:
          type: array
          items:
            $ref: '../schemas/DrsObject.yaml'
          description: Array of updated DRS objects with current state
    example:
      objects:
        - id: "abc123"
          self_uri: "drs://example.org/abc123"
          size: 1073741824
          checksums:
            - checksum: "a1b2c3d4e5f6"
              type: "md5"
          access_methods:
            - type: "s3"
              access_id: "s3-us-east-1"
              access_url:
                url: "s3://us-bucket/file.bam"
            - type: "s3"
              access_id: "s3-eu-west-1"
              access_url:
                url: "s3://eu-bucket/file.bam"
          created_time: "2024-01-01T00:00:00Z"
          updated_time: "2024-01-15T12:30:00Z"
