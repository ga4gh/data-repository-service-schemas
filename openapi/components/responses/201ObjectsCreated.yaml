description: DRS objects were successfully registered as an atomic transaction. Returns the complete DRS objects with server-minted IDs and timestamps. All candidate objects were validated and registered together - if any had failed, none would have been registered.
content:
  application/json:
    schema:
      type: object
      required:
        - objects
      properties:
        objects:
          type: array
          items:
            $ref: '../schemas/DrsObject.yaml'
          description: Array of registered DRS objects in the same order as the candidates in the request
    examples:
      single_object_created:
        summary: Single object registered
        description: Response after registering one DRS object
        value:
          objects:
            - id: "drs_obj_a1b2c3d4e5f6"
              self_uri: "drs://drs.example.org/drs_obj_a1b2c3d4e5f6"
              name: "sample_data.vcf"
              size: 1048576
              mime_type: "text/plain"
              created_time: "2024-01-15T10:30:00Z"
              updated_time: "2024-01-15T10:30:00Z"
              version: "1.0"
              checksums:
                - checksum: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
                  type: "sha-256"
              access_methods:
                - type: "s3"
                  access_url:
                    url: "s3://my-bucket/uploads/sample_data.vcf"
              description: "Variant call format file for sample analysis"
      multiple_objects_created:
        summary: Multiple objects registered
        description: Response after registering multiple DRS objects
        value:
          objects:
            - id: "drs_obj_a1b2c3d4e5f6"
              self_uri: "drs://drs.example.org/drs_obj_a1b2c3d4e5f6"
              name: "genome_assembly.fasta"
              size: 3221225472
              mime_type: "text/plain"
              created_time: "2024-01-15T09:00:00Z"
              updated_time: "2024-01-15T09:00:00Z"
              version: "1.0"
              checksums:
                - checksum: "a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3"
                  type: "sha-256"
              access_methods:
                - type: "s3"
                  access_url:
                    url: "s3://genomics-bucket/assemblies/hg38.fasta"
              description: "Human genome reference assembly"
            - id: "drs_obj_f6e5d4c3b2a1"
              self_uri: "drs://drs.example.org/drs_obj_f6e5d4c3b2a1"
              name: "annotations.gff3"
              size: 524288000
              mime_type: "text/plain"
              created_time: "2024-01-15T09:15:00Z"
              updated_time: "2024-01-15T09:15:00Z"
              version: "1.0"
              checksums:
                - checksum: "b94d27b9934d3e08a52e52d7da7dabfac484efe37a5380ee9088f7ace2efcde9"
                  type: "sha-256"
              access_methods:
                - type: "https"
                  access_url:
                    url: "https://data.example.org/files/annotations.gff3"
              description: "Gene annotations in GFF3 format"

        controlled_access_object_created:
          summary: Controlled-access object registered
          description: >-
            Response after registering an object with controlled-access claims.
            The returned `DrsObject` includes the claims that will be evaluated
            for future read operations.
          value:
            objects:
              - id: "drs_obj_ca_123456"
                self_uri: "drs://drs.example.org/drs_obj_ca_123456"
                name: "tumor-normal.cram"
                size: 4294967296
                mime_type: "application/octet-stream"
                created_time: "2024-01-15T10:30:00Z"
                updated_time: "2024-01-15T10:30:00Z"
                version: "1.0"
                checksums:
                  - checksum: "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
                    type: "sha-256"
                controlled_access:
                  - "https://auth.example.org/datasets/phs000123"
                  - "https://auth.example.org/projects/lung-study"
                access_methods:
                  - type: "s3"
                    access_url:
                      url: "s3://controlled-bucket/phs000123/tumor-normal.cram"
                description: "Controlled-access tumor-normal CRAM"

        open_access_object_created:
          summary: Open-access object registered
          description: >-
            Response after registering an object without controlled-access
            claims. Because `controlled_access` is missing or empty, the object
            is treated as open access for read operations.
          value:
            objects:
              - id: "drs_obj_open_123456"
                self_uri: "drs://drs.example.org/drs_obj_open_123456"
                name: "public-reference.fa"
                size: 1024
                mime_type: "text/plain"
                created_time: "2024-01-15T10:30:00Z"
                updated_time: "2024-01-15T10:30:00Z"
                checksums:
                  - checksum: "2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae"
                    type: "sha-256"
                access_methods:
                  - type: "https"
                    access_url:
                      url: "https://data.example.org/public/public-reference.fa"
                description: "Open-access public reference file"
