type: object
required:
  - name
  - size
  - mime_type
  - checksums
  - upload_methods
properties:
  name:
    type: string
    description: The name of the file
  size:
    type: integer
    format: int64
    description: Size of the file in bytes
  mime_type:
    type: string
    description: MIME type of the file
  checksums:
    type: array
    items:
      $ref: './Checksum.yaml'
    minItems: 1
    description: Array of checksums for file integrity verification
  description:
    type: string
    description: Optional description of the file
  aliases:
    type: array
    items:
      type: string
    description: Optional array of alternative names
  upload_methods:
    type: array
    items:
      $ref: './UploadMethod.yaml'
    description: Available methods for uploading this file
    minItems: 1
  access_id:
    type: string
    description: >-
      A unique identifier for this upload that will be referenced in the access_methods
      during object registration. This ties the upload response to the subsequent
      registration request, allowing the server to track which uploads correspond
      to which registered objects.
    example: "upload_abc123xyz"