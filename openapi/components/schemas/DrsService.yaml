type: object
required:
  - type
  - maxBulkRequestLength
properties:
  maxBulkRequestLength:
    type: integer
    description: DEPRECATED - In 2.0 this will move to under the drs section of service info and not at the root level. The max length the bulk request endpoints can handle (>= 1) before generating a 413 error e.g. how long can the arrays bulk_object_ids and bulk_object_access_ids be for this server.  
  type:
    type: object
    required:
      - artifact
    properties:
      artifact:
        type: string
        enum: [drs]
        example: drs
  drs:
    type: object
    required:
      - maxBulkRequestLength
    properties:
      maxBulkRequestLength:
        type: integer
        description: The max length the bulk request endpoints can handle (>= 1) before generating a 413 error e.g. how long can the arrays bulk_object_ids and bulk_object_access_ids be for this server.  
      objectCount:
        type: integer
        description: The total number of objects in this DRS service.
      totalObjectSize:
        type: integer
        description: The total size of all objects in this DRS service in bytes.  As a general best practice, file bytes are counted for each unique file and not cloud mirrors or other redundant copies.
      uploadRequestSupported:
        type: boolean
        description: >-
          Indicates whether this DRS server supports upload request operations via the `/upload-request` endpoint.
          If true, clients can request upload methods and credentials for uploading files.
          If false or missing, the server does not support upload request coordination.
        default: false
      objectRegistrationSupported:
        type: boolean
        description: >-
          Indicates whether this DRS server supports object registration operations via the `/objects/register` endpoint.
          If true, clients can register uploaded files or existing data as DRS objects.
          If false or missing, the server does not support object registration.
        default: false
      supportedUploadMethods:
        type: array
        items:
          type: string
          enum:
            - s3
            - gs
            - https
            - ftp
            - sftp
        description: >-
          List of upload methods supported by this DRS server. Only present when uploadRequestSupported is true.
          Clients can use this information to determine which upload methods are available before making upload requests.
          
          - **s3**: Direct S3 upload with temporary AWS credentials
          - **gs**: Google Cloud Storage upload with access tokens  
          - **https**: Presigned POST URL for HTTP uploads
          - **ftp**: File Transfer Protocol uploads
          - **sftp**: Secure File Transfer Protocol uploads
          - **gsiftp**: GridFTP secure file transfer
          - **globus**: Globus transfer service for high-performance data movement
      maxUploadSize:
        type: integer
        format: int64
        description: >-
          Maximum file size in bytes that can be uploaded via the upload endpoints.
          Only present when uploadRequestSupported is true. If not specified, there is no explicit size limit.
      maxUploadRequestLength:
        type: integer
        description: >-
          Maximum number of files that can be included in a single upload request.
          Only present when uploadRequestSupported is true. If not specified, defaults to the same value as maxBulkRequestLength.
      maxRegisterRequestLength:
        type: integer
        description: >-
          Maximum number of candidate objects that can be included in a single registration request.
          Only present when objectRegistrationSupported is true. If not specified, defaults to the same value as maxBulkRequestLength.
      validateUploadChecksums:
        type: boolean
        description: >-
          Indicates whether this DRS server validates uploaded file checksums against the provided metadata.
          If true, the server will verify that uploaded files match their declared checksums and may reject uploads with mismatches.
          If false or missing, the server does not perform checksum validation and relies on client-provided metadata.
          Only present when uploadRequestSupported or objectRegistrationSupported is true.
        default: false
      validateUploadFileSizes:
        type: boolean
        description: >-
          Indicates whether this DRS server validates uploaded file sizes against the provided metadata.
          If true, the server will verify that uploaded files match their declared sizes and may reject uploads with mismatches.
          If false or missing, the server does not perform file size validation and relies on client-provided metadata.
          Only present when uploadRequestSupported or objectRegistrationSupported is true.
        default: false
      relatedFileStorageSupported:
        type: boolean
        description: >-
          Indicates whether this DRS server supports storing files from the same upload request under a common prefix or folder structure.
          If true, the server will organize related files together in storage, enabling bioinformatics workflows that expect co-located files (e.g., CRAM + CRAI, VCF + TBI).
          If false or missing, the server may distribute files across different storage locations or prefixes.
          Only present when uploadRequestSupported is true. This feature is particularly valuable for genomics tools like samtools that expect index files to be co-located with data files.
        default: false
      deleteSupported:
        type: boolean
        description: >-
          Indicates whether this DRS server supports delete operations via the delete endpoints.
          If true, clients can delete DRS objects using POST requests to `/objects/{object_id}/delete` and `/objects/delete`.
          If false or missing, the server does not support delete operations and will return 404 for delete endpoint requests.
          Like upload functionality, delete support is entirely optional and servers remain DRS compliant without it.
        default: false
      maxBulkDeleteLength:
        type: integer
        description: >-
          Maximum number of objects that can be deleted in a single bulk delete request via `/objects/delete`.
          Only present when deleteSupported is true. If not specified when delete is supported, defaults to the same value as maxBulkRequestLength.
          Servers may enforce lower limits for delete operations compared to other bulk operations for safety reasons.
      deleteStorageDataSupported:
        type: boolean
        description: >-
          Indicates whether this DRS server supports attempting to delete underlying storage data when clients request it.
          If true, the server will attempt to delete both metadata and storage files when `delete_storage_data: true` is specified in delete requests.
          If false or missing, the server only supports metadata deletion regardless of client request, preserving underlying storage data.
          Only present when deleteSupported is true. This is a capability flag indicating what the server can attempt, not a default behavior setting.
          Note: Storage deletion attempts may fail due to permissions, network issues, or storage service errors.
        default: false


    
