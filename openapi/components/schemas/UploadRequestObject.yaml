type: object
required:
  - name
  - size
  - mime_type
  - checksums
properties:
  name:
    type: string
    description: The name of the file to upload
  size:
    type: integer
    format: int64
    description: Size of the file in bytes
  mime_type:
    type: string
    description: MIME type of the file
  checksums:
    type: array
    items:
      $ref: './Checksum.yaml'
    minItems: 1
    description: Array of checksums for file integrity verification
  description:
    type: string
    description: Optional description of the file
  aliases:
    type: array
    items:
      type: string
    description: Optional array of alternative names for the file
  upload_method_types:
    type: array
    items:
      type: string
    description: >-
      Optional array of requested upload method types which should match those published by 
      the server in the `supportedUploadMethodsTypes` field in  the `/service-info` response. 
      Servers SHALL try to honour requests, but the server may not be able to offer the 
      requested upload type for specific file types/sizes etc. The server MAY return a 
      400 error if it cannot honour the request, or MAY return an alternative 
      supported upload method.