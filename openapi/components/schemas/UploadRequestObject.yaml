type: object
required:
  - name
  - size
  - mime_type
  - checksums
properties:
  name:
    type: string
    description: The name of the file to upload
  size:
    type: integer
    format: int64
    description: Size of the file in bytes
  mime_type:
    type: string
    description: MIME type of the file
  checksums:
    type: array
    items:
      $ref: './Checksum.yaml'
    minItems: 1
    description: Array of checksums for file integrity verification
  description:
    type: string
    description: Optional description of the file
  aliases:
    type: array
    items:
      type: string
    description: Optional array of alternative names for the file
  requested_upload_methods:
    type: array
    items:
      type: object
      properties:
        type:
          type: string
          enum:
            - s3
            - gs
            - https
            - ftp
            - sftp
          description: The upload method type requested
        cloud_provider:
          type: string
          description: Preferred cloud provider (e.g., "aws", "gcp", "azure")
          example: "aws"
        region:
          type: string
          description: Preferred cloud region for upload
          example: "us-east-1"
    description: >-
      Optional array of requested upload methods with cloud provider and region preferences.
      Clients can use this to indicate where they prefer to upload files, which can be better
      from a security standpoint by limiting the scope of upload locations. The server will
      attempt to honor these preferences but may return different or additional options based
      on availability and server policies.