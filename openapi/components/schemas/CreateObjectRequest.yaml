type: object
required:
  - name
  - size
  - checksums
  - access_methods
properties:
  name:
    type: string
    description: The name of the uploaded file
  size:
    type: integer
    format: int64
    description: Size of the uploaded file in bytes
  checksums:
    type: array
    items:
      $ref: './Checksum.yaml'
    minItems: 1
    description: Checksums of the uploaded file for integrity verification
  access_methods:
    type: array
    items:
      $ref: './AccessMethod.yaml'
    minItems: 1
    description: Access methods for retrieving the uploaded file
  description:
    type: string
    description: Optional description of the file
  aliases:
    type: array
    items:
      type: string
    description: Optional array of alternative names for the file
  mime_type:
    type: string
    description: MIME type of the uploaded file
  version:
    type: string
    description: Optional version identifier for the file
  created_time:
    type: string
    format: date-time
    description: Timestamp when the file was created
  updated_time:
    type: string
    format: date-time
    description: Timestamp when the file was last updated