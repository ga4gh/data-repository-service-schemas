type: object
required:
  - id
properties:
  id:
    type: string
    description: The ID of the DRS object to update
    example: "drs://example.org/abc123"
  name:
    type: string
    description: Updated name for the object (optional)
  description:
    type: string
    description: Updated description for the object (optional)
  aliases:
    type: array
    items:
      type: string
    description: Updated list of aliases (optional)
  mime_type:
    type: string
    description: Updated MIME type (optional)
  version:
    type: string
    description: Updated version string (optional)
  add_access_methods:
    type: array
    items:
      $ref: './AccessMethod.yaml'
    description: >-
      Access methods (mirrors) to add to this object. All new access methods must point
      to files with the same checksums as the existing object. Server will validate
      checksums match before adding mirrors.
  remove_access_ids:
    type: array
    items:
      type: string
    description: >-
      Access IDs of access methods to remove from this object. At least one access method
      must remain after removal. If provided access_id doesn't exist, it will be silently ignored.
    example: ["s3-us-east-1", "gs-europe-west1"]
