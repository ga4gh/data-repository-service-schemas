type: object
description: Result for an individual object in a bulk delete operation
required:
  - object_id
  - status
properties:
  object_id:
    type: string
    description: The DRS object ID
    example: "drs_object_123456"
  status:
    type: integer
    description: HTTP status code for this object
    example: 204
  message:
    type: string
    description: Human-readable status message
    example: "Successfully deleted"
  error:
    $ref: './Error.yaml'
    description: Error details if deletion failed