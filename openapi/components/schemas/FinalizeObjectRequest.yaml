type: object
required:
  - uploaded_locations
properties:
  uploaded_locations:
    type: array
    items:
      type: object
      required:
        - storage_location_id
        - checksums
      properties:
        storage_location_id:
          type: string
          description: The storage location where data was uploaded
          example: "us-east-1-s3"
        checksums:
          type: array
          items:
            $ref: './Checksum.yaml'
          minItems: 1
          description: Checksums computed after upload to verify integrity
    minItems: 1
    description: List of storage locations where the object was successfully uploaded