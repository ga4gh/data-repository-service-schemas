type: object
required:
  - type
  - access_url
properties:
  type:
    type: string
    enum:
      - s3
      - gs
      - https
      - ftp
      - sftp
      - gsiftp
      - globus
    description: >-
      Type of upload method. Implementations MAY support any subset of these types.
      
      The 'https' type can be used to return a presigned POST URL and is expected to be
      the most common implementation for typical file uploads. This method provides a
      simple HTTP POST interface that works with standard web clients.
      
      The 's3' type is primarily intended to support uploads of large files that want
      to take advantage of multipart uploads and automatic retries implemented in AWS
      libraries. This method provides direct access to S3-specific upload capabilities.
      
      Other common implementations include 'gs' for Google Cloud Storage and 'sftp'
      for secure FTP uploads.
  access_url:
    allOf:
      - $ref: './AccessURL.yaml'
      - description: >-
          An `AccessURL` that specifies where the file will be accessible after upload.
          This URL will be used as the access_url in the eventual DRS object, ensuring
          consistency between upload and retrieval operations.
  region:
    type: string
    description: >-
      Cloud region for the upload location. Optional for non-cloud storage types.
    example: us-east-1
  upload_details:
    type: object
    additionalProperties: true
    description: >-
      A dictionary of upload-specific configuration details that vary by upload method type.
      The contents and structure depend on the specific upload method being used.