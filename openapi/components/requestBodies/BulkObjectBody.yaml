required: true
content:
  application/json:
    schema:
      type: object
      properties:
        passports:
          type: array
          items:
            type: string
            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJnYTRnaF9wYXNzcG9ydF92MSI6W119.JJ5rN0ktP0qwyZmIPpxmF_p7JsxAZH6L6brUxtad3CM
          description: the encoded JWT GA4GH Passport that contains embedded Visas.  The overall JWT is signed as are the individual Passport Visas.
        bulk_object_ids:
          type: array
          items:
            type: string
          description: >-
            An array of ObjectIDs for retrieve mode. When this field is present, the endpoint 
            behaves as a bulk retrieval operation returning metadata for the specified objects.
        objects:
          type: array
          items:
            $ref: '../schemas/DrsObject.yaml'
          description: >-
            An array of fully formed DRS objects for register mode. When this field is present, 
            the endpoint registers the supplied DRS objects using the passports for authorization.
            This field is mutually exclusive with bulk_object_ids.
    examples:
      bulk_retrieve:
        summary: Bulk retrieve mode
        description: Retrieve metadata for multiple existing DRS objects using their IDs
        value:
          passports:
            - "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJnYTRnaF9wYXNzcG9ydF92MSI6W119.JJ5rN0ktP0qwyZmIPpxmF_p7JsxAZH6L6brUxtad3CM"
          bulk_object_ids:
            - "drs_object_123456"
            - "drs_object_789012"
            - "drs_object_345678"
      bulk_register:
        summary: Bulk register mode
        description: Register multiple fully formed DRS objects after upload
        value:
          passports:
            - "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJnYTRnaF9wYXNzcG9ydF92MSI6W119.JJ5rN0ktP0qwyZmIPpxmF_p7JsxAZH6L6brUxtad3CM"
          objects:
            - id: "drs_object_123456"
              self_uri: "drs://drs.example.org/drs_object_123456"
              name: "sample_data.vcf"
              size: 1048576
              mime_type: "text/plain"
