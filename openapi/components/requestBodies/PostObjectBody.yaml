required: true
content:
  application/json:
    schema:
      type: object
      properties:
        expand:
          type: boolean
          example: false
          description: >-
            If false and the object_id refers to a bundle, then the ContentsObject array
            contains only those objects directly contained in the bundle. That is, if the
            bundle contains other bundles, those other bundles are not recursively
            included in the result.

            If true and the object_id refers to a bundle, then the entire set of objects
            in the bundle is expanded. That is, if the bundle contains other bundles,
            then those other bundles are recursively expanded and included in the result.
            Recursion continues through the entire sub-tree of the bundle.

            If the object_id refers to a blob, then the query parameter is ignored.
        passports:
          type: array
          items:
            type: string
            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJnYTRnaF9wYXNzcG9ydF92MSI6W119.JJ5rN0ktP0qwyZmIPpxmF_p7JsxAZH6L6brUxtad3CM
          description: the encoded JWT GA4GH Passport that contains embedded Visas.  The overall JWT is signed as are the individual Passport Visas.
        object:
          $ref: '../schemas/DrsObject.yaml'
          description: >-
            Optional fully formed DRS object to register. If this field is missing,
            the endpoint behaves as a GET request with passport authentication to retrieve object metadata.
            If an object is provided, the server will register the supplied DRS object using the passports for authorization.
    examples:
      retrieve_mode:
        summary: Retrieve mode (backward compatible)
        description: Request object metadata with passport authentication - no objects array provided
        value:
          expand: false
          passports:
            - "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJnYTRnaF9wYXNzcG9ydF92MSI6W119.JJ5rN0ktP0qwyZmIPpxmF_p7JsxAZH6L6brUxtad3CM"
      retrieve_mode_expanded:
        summary: Retrieve mode with bundle expansion
        description: Request expanded bundle contents with passport authentication
        value:
          expand: true
          passports:
            - "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJnYTRnaF9wYXNzcG9ydF92MSI6W119.JJ5rN0ktP0qwyZmIPpxmF_p7JsxAZH6L6brUxtad3CM"
            - "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJnYTRnaF9wYXNzcG9ydF92MSI6W119.additional_passport_signature"
      register_mode:
        summary: Register mode - single object
        description: Register a single fully formed DRS object
        value:
          passports:
            - "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJnYTRnaF9wYXNzcG9ydF92MSI6W119.JJ5rN0ktP0qwyZmIPpxmF_p7JsxAZH6L6brUxtad3CM"
          object:
            id: "drs_object_123456"
            self_uri: "drs://drs.example.org/drs_object_123456"
            name: "sample_data.vcf"
            size: 1048576
            mime_type: "text/plain"
            created_time: "2024-01-15T10:30:00Z"
            updated_time: "2024-01-15T10:30:00Z"
            version: "1.0"
            checksums:
              - checksum: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
                type: "sha-256"
            access_methods:
              - type: "s3"
                access_url:
                  url: "https://my-bucket.s3.amazonaws.com/files/drs_object_123456"
                region: "us-east-1"
            description: "Variant call format file for sample analysis"
            aliases:
