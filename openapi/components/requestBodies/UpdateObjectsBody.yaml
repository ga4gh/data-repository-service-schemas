description: Request body for updating DRS objects (adding/removing mirrors)
required: true
content:
  application/json:
    schema:
      type: object
      required:
        - updates
      properties:
        updates:
          type: array
          items:
            $ref: '../schemas/ObjectUpdate.yaml'
          minItems: 1
          description: Array of object updates to apply
        passports:
          type: array
          items:
            type: string
          description: Optional array of GA4GH Passport JWTs for authorization
    examples:
      add_mirror:
        summary: Add a mirror in a different region
        description: Add an S3 mirror in eu-west-1 for an existing object
        value:
          updates:
            - id: "abc123"
              add_access_methods:
                - type: "s3"
                  access_id: "s3-eu-west-1"
                  access_url:
                    url: "s3://eu-bucket/data/file.bam"
                  region: "eu-west-1"
      remove_mirror:
        summary: Remove an obsolete mirror
        description: Remove an access method that is no longer available
        value:
          updates:
            - id: "abc123"
              remove_access_ids:
                - "s3-us-west-2"
      add_and_remove:
        summary: Replace mirrors
        description: Remove old mirrors and add new ones
        value:
          updates:
            - id: "abc123"
              add_access_methods:
                - type: "gs"
                  access_id: "gs-asia-east1"
                  access_url:
                    url: "gs://asia-bucket/data/file.bam"
                  region: "asia-east1"
              remove_access_ids:
                - "s3-us-east-1"
                - "s3-us-west-2"
      bulk_update:
        summary: Update multiple objects
        description: Add mirrors to multiple objects in a single request
        value:
          updates:
            - id: "abc123"
              add_access_methods:
                - type: "s3"
                  access_id: "s3-eu-west-1"
                  access_url:
                    url: "s3://eu-bucket/data/file1.bam"
            - id: "def456"
              add_access_methods:
                - type: "gs"
                  access_id: "gs-us-central1"
                  access_url:
                    url: "gs://us-bucket/data/file2.vcf"
