info:
  title: Data Repository Service
  version: 1.6.0
  x-logo:
    url: >-
      https://www.ga4gh.org/wp-content/themes/ga4gh/dist/assets/svg/logos/logo-full-color.svg
  termsOfService: https://www.ga4gh.org/terms-and-conditions/
  contact:
    name: GA4GH Cloud Work Stream
    email: ga4gh-cloud@ga4gh.org
  license:
    name: Apache 2.0
    url: >-
      https://raw.githubusercontent.com/ga4gh/data-repository-service-schemas/master/LICENSE
servers:
  - url: https://{serverURL}/ga4gh/drs/v1
    variables:
      serverURL:
        default: drs.example.org
        description: >
          DRS server endpoints MUST be prefixed by the '/ga4gh/drs/v1' endpoint
          path
security:
  - {}
  - BasicAuth: []
  - BearerAuth: []
tags:
  - name: Introduction
    description: >
      The Data Repository Service (DRS) API provides a generic interface to data
      repositories so data consumers, including workflow systems, can access
      data objects in a single, standard way regardless of where they are stored
      and how they are managed. The primary functionality of DRS is to map a
      logical ID to a means for physically retrieving the data represented by
      the ID. The sections below describe the characteristics of those IDs, the
      types of data supported, how they can be pointed to using URIs, and how
      clients can use these URIs to ultimately make successful DRS API requests.
      This document also describes the DRS API in detail and provides
      information on the specific endpoints, request formats, and responses.
      This specification is intended for developers of DRS-compatible services
      and of clients that will call these DRS services.


      The key words MUST, MUST NOT, REQUIRED, SHALL, SHALL NOT, SHOULD, SHOULD
      NOT, RECOMMENDED, MAY, and OPTIONAL in this document are to be interpreted
      as described in [RFC 2119](https://datatracker.ietf.org/doc/html/rfc2119).
  - name: DRS API Principles
    description: >
      ## DRS IDs


      Each implementation of DRS can choose its own id scheme, as long as it
      follows these guidelines:


      * DRS IDs are strings made up of uppercase and lowercase letters, decimal
      digits, hyphen, period, underscore and tilde [A-Za-z0-9.-_~]. See [RFC
      3986 § 2.3](https://datatracker.ietf.org/doc/html/rfc3986#section-2.3).

      * DRS IDs can contain other characters, but they MUST be encoded into
      valid DRS IDs whenever they are used in API calls. This is because
      non-encoded IDs may interfere with the interpretation of the
      objects/{id}/access endpoint. To overcome this limitation use
      percent-encoding of the ID, see [RFC 3986 §
      2.4](https://datatracker.ietf.org/doc/html/rfc3986#section-2.4)

      * One DRS ID MUST always return the same object data (or, in the case of a
      collection, the same set of objects). This constraint aids with
      reproducibility.

      * DRS implementations MAY have more than one ID that maps to the same
      object.

      * DRS version 1.x does NOT support semantics around multiple versions of
      an object. (For example, there’s no notion of “get latest version” or
      “list all versions”.) Individual implementations MAY choose an ID scheme
      that includes version hints.


      ## DRS URIs


      For convenience, including when passing content references to a [WES
      server](https://github.com/ga4gh/workflow-execution-service-schemas), we
      define a [URI
      scheme](https://en.wikipedia.org/wiki/Uniform_Resource_Identifier#Generic_syntax)
      for DRS-accessible content. This section documents the syntax of DRS URIs,
      and the rules clients follow for translating a DRS URI into a URL that
      they use for making the DRS API calls described in this spec.


      There are two styles of DRS URIs, Hostname-based and Compact
      Identifier-based, both using the `drs://` URI scheme. DRS servers may
      choose either style when exposing references to their content;. DRS
      clients MUST support resolving both styles.


      Tip:

      > See [Appendix: Background Notes on DRS
      URIs](#tag/Background-Notes-on-DRS-URIs) for more information on our
      design motivations for DRS URIs.


      ### Hostname-based DRS URIs


      Hostname-based DRS URIs are simpler than compact identifier-based URIs.
      They contain the DRS server name and the DRS ID only and can be converted
      directly into a fetchable URL based on a simple rule. They take the form:


      ```

      drs://<hostname>/<id>

      ```


      DRS URIs of this form mean *\"you can fetch the content with DRS id \<id\>
      from the DRS server at \<hostname\>\"*.

      For example, here are the client resolution steps if the URI is:


      ```

      drs://drs.example.org/314159

      ```


      1. The client parses the string to extract the hostname of
      “drs.example.org” and the id of “314159”.

      2. The client makes a GET request to the DRS server, using the standard
      DRS URL syntax:


      ```

      GET https://drs.example.org/ga4gh/drs/v1/objects/314159

      ```


      The protocol is always https and the port is always the standard 443 SSL
      port. It is invalid to include a different port in a DRS hostname-based
      URI.


      Tip:

      > See the [Appendix: Hostname-Based URIs](#tag/Hostname-Based-URIs) for
      information on how hostname-based DRS URI resolution to URLs is likely to
      change in the future, when the DRS v2 major release happens.


      ### Compact Identifier-based DRS URIs


      Compact Identifier-based DRS URIs use resolver registry services
      (specifically, [identifiers.org](https://identifiers.org/) and [n2t.net
      (Name-To-Thing)](https://n2t.net/)) to provide a layer of indirection
      between the DRS URI and the DRS server name — the actual DNS name of the
      DRS server is not present in the URI. This approach is based on the Joint
      Declaration of Data Citation Principles as detailed by [Wimalaratne et al
      (2018)](https://www.nature.com/articles/sdata201829).


      For more information, see the document [More Background on Compact
      Identifiers](./more-background-on-compact-identifiers.html).


      Compact Identifiers take the form:


      ```

      drs://[provider_code/]namespace:accession

      ```


      Together, provider code and the namespace are referred to as the `prefix`.
      The provider code is optional and is used by identifiers.org/n2t.net for
      compact identifier resolver mirrors. Both the `provider_code` and
      `namespace` disallow spaces or punctuation, only lowercase alphanumerical
      characters, underscores and dots are allowed (e.g. [A-Za-z0-9._]).


      Tip:

      > See the [Appendix: Compact Identifier-Based
      URIs](#tag/Compact-Identifier-Based-URIs) for more background on Compact
      Identifiers and resolver registry services like identifiers.org/n2t.net
      (aka meta-resolvers), how to register prefixes, possible caching
      strategies, and security considerations.


      #### For DRS Servers


      If your DRS implementation will issue DRS URIs based *on your own* compact
      identifiers, you MUST first register a new prefix with identifiers.org
      (which is automatically mirrored to n2t.net). You will also need to
      include a provider resolver resource in this registration which links the
      prefix to your DRS server, so that DRS clients can get sufficient
      information to make a successful DRS GET request. For clarity, we
      recommend you choose a namespace beginning with `drs`.


      #### For DRS Clients


      A DRS client parses the DRS URI compact identifier components to extract
      the prefix and the accession, and then uses meta-resolver APIs to locate
      the actual DRS server. For example, here are the client resolution steps
      if the URI is:


      ```

      drs://drs.42:314159

      ```


      1. The client parses the string to extract the prefix of `drs.42` and the
      accession of `314159`, using the first occurrence of a colon (":")
      character after the initial `drs://` as a delimiter. (The colon character
      is not allowed in a Hostname-based DRS URI, making it easy to tell them
      apart.)


      2. The client makes API calls to a meta-resolver to look up the URL
      pattern for the namespace. (See [Calling Meta-Resolver APIs for Compact
      Identifier-Based DRS
      URIs](#section/Calling-Meta-Resolver-APIs-for-Compact-Identifier-Based-DRS-URIs)
      for details.) The URL pattern is a string containing a `{$id}` parameter,
      such as:


      ```

      https://drs.myexample.org/ga4gh/drs/v1/objects/{$id}

      ```


      3. The client generates a DRS URL from the URL template by replacing {$id}
      with the accession it extracted in step 1. It then makes a GET request to
      the DRS server:


      ```

      GET https://drs.myexample.org/ga4gh/drs/v1/objects/314159

      ```


      4. The client follows any HTTP redirects returned in step 3, in case the
      resolver goes through an extra layer of redirection.


      For performance reasons, DRS clients SHOULD cache the URL pattern returned
      in step 2, with a suggested 24 hour cache life.


      ### Choosing a URI Style


      DRS servers can choose to issue either hostname-based or compact
      identifier-based DRS URIs, and can be confident that compliant DRS clients
      will support both. DRS clients must be able to accommodate both URI types.
      Tradeoffs that DRS server builders, and third parties who need to cite DRS
      objects in datasets, workflows or elsewhere, may want to consider include:


      *Table 1: Choosing a URI Style*


      |                   | Hostname-based | Compact Identifier-based |

      |-------------------|----------------|--------------------------|

      | URI Durability    | URIs are valid for as long as the server operator
      maintains ownership of the published DNS address. (They can of course
      point that address at different physical serving infrastructure as often
      as they would like.) | URIs are valid for as long as the server operator
      maintains ownership of the published compact identifier resolver
      namespace. (They also depend on the meta-resolvers like
      identifiers.org/n2t.net remaining operational, which is intended to be
      essentially forever.) |

      | Client Efficiency | URIs require minimal client logic, and no network
      requests, to resolve. | URIs require small client logic, and 1-2 cacheable
      network requests, to resolve. |

      | Security          | Servers have full control over their own security
      practices. | Server operators, in addition to maintaining their own
      security practices, should confirm they are comfortable with the resolver
      registry security practices, including protection against denial of
      service and namespace-hijacking attacks. (See the [Appendix: Compact
      Identifier-Based URIs](#tag/Compact-Identifier-Based-URIs) for more
      information on resolver registry security.) |


      ## DRS Datatypes

      DRS's job is data access, period. Therefore, the DRS API supports a simple
      flat content model -- every `DrsObject`, like a file, represents a single
      opaque blob of bytes. DRS has no understanding of the meaning of objects
      and only provides simple domain-agnostic metadata. Understanding the
      semantics of specific object types is the responsibility of the
      applications that use DRS to fetch those objects (e.g. samtools for BAM
      files, DICOM viewers for DICOM objects).


      ### Atomic Objects

      DRS can be used to access individual objects of all kinds, simple or
      complex, large or small, stored in type-specific formats (e.g. BAM files,
      VCF files, CSV files). At the API level these are all the same; at the
      application level, DRS clients and servers are expected to agree on object
      semantics using non-DRS mechanisms, including but not limited to the GA4GH
      Data Connect API.


      ### Compound Objects

      DRS can also be used to access compound objects, consisting of two or more
      atomic objects related to each other in a well-specified way. See the
      [Appendix: Compound Objects](#tag/Working-With-Compound-Objects) for
      suggested best practices for working with compound objects.


      ### [DEPRECATED] Bundles

      Previous versions of the DRS API spec included support for a *bundle*
      content type, which was a folder-like collection of other DRS objects
      (either blobs or bundles), represented by a `DrsObject` with a `contents`
      array. As of v1.3, bundles have been deprecated in favor of the best
      practices documented in the [Appendix: Compound
      Objects](#tag/Working-With-Compound-Objects). A future version of the API
      spec may remove bundle support entirely and/or replace bundles with a
      scalable approach based on the needs of our driver projects.


      ## Read-only by default


      Prior to version 1.6, DRS was a read-only API. Read access is still the
      only behaviour that every implementation is expected to provide. An
      implementation MAY also support optional write and lifecycle operations:
      uploading and registering objects, adding checksums, updating access
      methods, and deleting objects. These operations are independent of one
      another, and different deployments will legitimately support different
      subsets depending on their role. A read-only mirror might support none of
      them, an ingest service might support upload and registration but not
      deletion, and a curated registry might support registration and metadata
      updates for data held elsewhere without accepting uploads. A server MAY
      support any combination of them, including none at all, and MUST
      accurately advertise which it supports through the corresponding
      capability flags in `/service-info`, each of which is described in the
      relevant appendix. Clients SHOULD rely on these flags rather than assume
      that support for one operation implies support for any other. These
      operations are purely additive: a server can adopt any of them without
      changing the read behaviour defined by earlier versions, so existing
      read-only clients continue to work unchanged. Implementations are still
      free to define their own mechanisms and interfaces for managing data
      beyond these.


      We expect DRS objects to behave as stable records, whose identity and
      descriptive metadata do not change once they are registered. Where changes
      after registration are supported, they are limited to two cases. Access
      methods MAY be updated, because they point to a current storage location
      that can change as data is migrated. Checksums MAY be added, though
      servers are not expected to alter existing checksums, so that a consumer
      can attach an algorithm such as SHA-256 for content addressing without it
      having to be required at upload time. Object versioning and the
      restoration of deleted objects are out of scope here, and may be addressed
      in a future version of the spec.


      ## Standards


      The DRS API specification is written in OpenAPI and embodies a RESTful
      service philosophy. It uses JSON in requests and responses and standard
      HTTPS on port 443 for information transport.  Optionally, it

      supports authentication and authorization using the [GA4GH
      Passport](https://github.com/ga4gh-duri/ga4gh-duri.github.io/tree/master/researcher_ids)
      standard.
  - name: Authorization & Authentication
    description: >
      ## Making DRS Requests


      The DRS implementation is responsible for defining and enforcing an
      authorization policy that determines which users are allowed to make which
      requests. GA4GH recommends that DRS implementations use an OAuth 2.0
      [bearer token](https://oauth.net/2/bearer-tokens/) or a [GA4GH
      Passport](https://github.com/ga4gh-duri/ga4gh-duri.github.io/tree/master/researcher_ids),
      although they can choose other mechanisms if appropriate.


      ## Fetching DRS Objects


      The DRS API allows implementers to support a variety of different content
      access policies, depending on what `AccessMethod` records they return. 
      Implementers have a choice to make the

      GET /objects/{object_id} and GET /objects/{object_id}/access/{access_id}
      calls open or requiring a Basic, Bearer, or Passport token (Passport
      requiring a POST).  The following describes the

      various access approaches following a successful GET/POST
      /objects/{object_id} request in order to them obtain access to the bytes
      for a given object ID/access ID:


      * public content:
          * server provides an `access_url` with a `url` and no `headers`
          * caller fetches the object bytes without providing any auth info
      * private content that requires the caller to have out-of-band auth
      knowledge (e.g. service account credentials):
          * server provides an `access_url` with a `url` and no `headers`
          * caller fetches the object bytes, passing the auth info they obtained out-of-band
      * private content that requires the caller to pass an Authorization token:
          * server provides an `access_url` with a `url` and `headers`
          * caller fetches the object bytes, passing auth info via the specified header(s)
      * private content that uses an expensive-to-generate auth mechanism (e.g.
      a signed URL):
          * server provides an `access_id`
          * caller passes the `access_id` to the `/access` endpoint
          * server provides an `access_url` with the generated mechanism (e.g. a signed URL in the `url` field)
          * caller fetches the object bytes from the `url` (passing auth info from the specified headers, if any)

      In the approaches above [GA4GH
      Passports](https://github.com/ga4gh-duri/ga4gh-duri.github.io/tree/master/researcher_ids)
      are not mentioned and that is on purpose.  A DRS server may return a
      Bearer token or other platform-specific token in a header in response to a
      valid Bearer token or GA4GH Passport (Option 3 above).  But it is not the
      responsibility of a DRS server to return a Passport, that is the
      responsibility of a Passport Broker and outside the scope of DRS.


      DRS implementers should ensure their solutions restrict access to targets
      as much as possible, detect attempts to exploit through log monitoring,
      and they are prepared to take action if an exploit in their DRS
      implementation is detected.


      ## Authentication


      ### Discovery


      The APIs to fetch [DrsObjects](#tag/DrsObjectModel) and
      [AccessURLs](#tag/AccessURLModel) may require authorization. The
      authorization mode may vary between DRS objects hosted by a service. The
      authorization mode may vary between the APIs to fetch a
      [DrsObject](#tag/DrsObjectModel) and an associated
      [AccessURL](#tag/AccessURLModel). Implementers should indicate how to
      authenticate to fetch a [DrsObject](#tag/DrsObjectModel) by implementing
      the [OptionsOjbect](#operation/OptionsObject) API. Implementers should
      indicate how to authenticate to fetch an [AccessURL](#tag/AccessURLModel)
      within a [DrsObject](#tag/DrsObjectModel). 


      ### Modes


      #### BasicAuth


      A valid authorization token must be passed in the 'Authorization' header,
      e.g. "Basic ${token_string}"


      | Security Scheme Type | HTTP |

      |----------------------|------|

      | **HTTP Authorization Scheme** | basic |


      #### BearerAuth


      A valid authorization token must be passed in the 'Authorization' header,
      e.g. "Bearer ${token_string}"


      | Security Scheme Type | HTTP |

      |----------------------|------|

      | **HTTP Authorization Scheme** | bearer |


      #### PassportAuth


      A valid authorization [GA4GH
      Passport](https://github.com/ga4gh-duri/ga4gh-duri.github.io/tree/master/researcher_ids)
      token must be passed in the body of a POST request


      | Security Scheme Type | HTTP |

      |----------------------|------|

      | **HTTP POST** | tokens[] |
  - name: Objects
    description: >-
      Operations for retrieving, registering, updating, and deleting DRS
      objects.
  - name: Upload Request
    description: >
      > Upload and object registration are optional DRS extensions. Clients
      should check `/service-info` for `uploadRequestSupported` and
      `objectRegistrationSupported` before attempting to use these endpoints.


      The DRS upload and object registration endpoints allow clients to
      negotiate with servers on mutually convenient storage backends and then
      register uploads as DRS objects. The expected flow has three phases:


      1. Request the upload locations by sending the file metadata to
      `/upload-request`, which returns the available upload methods and
      credentials.

      2. Upload the files to storage using those URLs and credentials and the
      storage provider's own upload mechanisms. DRS is not involved in this step
      at all; it simply enables clients and servers to agree on a mutually
      convenient storage service.

      3. Register the uploaded files as DRS objects by sending them to
      `/objects/register`.


      This approach separates storage service and credential negotiation from
      file transfer and object registration, supporting a vendor-neutral means
      of sharing data in a DRS network.


      This three-phase exchange is the expected flow, but the specification does
      not preclude others. Because both the request and the response carry a
      structured `upload_methods` field, with method-specific `upload_details`,
      clients and servers can negotiate other arrangements, for example a server
      performing a copy from a client-supplied location rather than the client
      uploading. Such alternative flows, and the shape and contents of
      `upload_details`, are deliberately left undefined here so the protocol can
      accommodate future data transfer patterns.


      The `/objects/register` endpoint can be used independently to register
      existing data without using the `/upload-request` endpoint, and servers
      can choose to only support object registration and not uploads by setting
      the `uploadRequestSupported` and `objectRegistrationSupported` flags
      appropriately in `/service-info`.


      Upload requests and object registration endpoints only support bulk
      requests to simplify implementation and reflect real-world usage patterns.
      Bioinformatics workflows often involve uploading multiple related files
      together (e.g., BAM and VCF files with their indices, or analysis result
      sets), making bulk operations a natural fit. Single files/objects are
      handled as lists with one element. Implementations of the
      `/objects/register` endpoint SHOULD implement transaction semantics so
      that either all of the objects included in the request are successfully
      registered or none of them are, and clients should be robust to this
      behaviour. Transaction semantics for the `/upload-request` are encouraged
      but not required due to the variety and complexity of data transfer
      technologies.


      The `/upload-request` endpoint need not result in any state being
      maintained on the DRS server (intermediate DRS object IDs etc.); in its
      simplest form it is just a means for a server to provide details of where
      a client can upload data, and the server should ensure that it trusts the
      client before providing such details (e.g. with appropriate authentication
      and authorisation before processing the request). This means that for such
      stateless implementations, if uploads fail and there is no later call to
      `/objects/register` there is no DRS state to manage, simplifying server
      implementation. Some upload methods MAY require the server to maintain
      transfer state (for example a server-performed copy from a client-supplied
      location); this specification does not preclude that.


      However, servers SHOULD ensure that any data from unsuccessful uploads
      (e.g. incomplete multi-part uploads) are cleaned up, for example by using
      lifecycle configuration in the backend storage. There is _no_ means of
      requiring that a client ultimately registers a DRS object pointing at data
      uploaded, and so servers should consider implementing some form of storage
      "garbage collection", a straightforward approach is to set a short
      lifecycle policy on the upload location and move uploaded data that is
      later registered as DRS objects to other locations, updating object
      `access_methods` accordingly. Servers should also implement some means of
      constraining upload size (quotas etc.) to protect against accidental or
      malicious unconstrained uploads. Servers can choose to validate that the
      uploads match the claimed object size when `/objects/register` is called,
      and should advertise this behaviour with the `validateFileSizes` flag in
      `/service-info`.


      The `/upload-request` endpoint can return one or more `upload_methods` of
      different types for each requested file, and backend specific details such
      as bucket names, object keys and credentials are supplied in a generic
      `upload_details` field. A straightforward implementation might return a
      single time-limited pre-signed POST URL as the `post_url` for an
      `upload_method` of type `https` which incorporates authentication into the
      URL, but because DRS is often used for large files such as BAMs and CRAMs
      this specification also supports more sophisticated upload approaches
      implemented by cloud storage backends such as multi-part uploads,
      automatic retries etc. The `upload_details` field can be used to include
      bucket names, keys and temporary credentials that can be used in native
      clients and SDKs. This offers a natural way to adapt this protocol to new
      storage technologies. Refer to the examples below for some suggested
      implementations.


      ## Service discovery


      Check `/service-info` for upload capabilities:


      ```json

      {
        "drs": {
          "uploadRequestSupported": true,
          "objectRegistrationSupported": true,
          "supportedUploadMethodTypes": ["s3", "https"],
          "maxUploadSize": 5368709120,
          "maxUploadRequestLength": 50,
          "maxRegisterRequestLength": 50,
          "validateChecksums": true,
          "validateFileSizes": false,
          "relatedFileStorageSupported": true
        }
      }

      ```


      Upload related fields:


      - `uploadRequestSupported`: Upload request operations available via
      `/upload-request`

      - `objectRegistrationSupported`: Object registration operations available
      via `/objects/register`

      - `supportedUploadMethodTypes`: Available storage backends  

      - `maxUploadSize`: File size limit (bytes)

      - `maxUploadRequestLength`: Files per request limit for upload requests

      - `maxRegisterRequestLength`: Candidate objects per request limit for
      registration

      - `validateChecksums`/`validateFileSizes`: Server validation behavior

      - `relatedFileStorageSupported`: Files from same upload request will be
      stored under common prefixes


      ## Upload methods


      Upon receipt of a request for an upload method for a specific file, the
      server will respond with an array of `upload_methods`, each with
      associated `type` and corresponding `upload_details` with upload
      locations, temporary credentials etc. These details are specific to
      backend implementations.


      Example storage backends include `https`, which returns presigned POST
      URLs for HTTP uploads; `s3`, which provides direct S3 upload with
      temporary AWS credentials scoped by an IAM session policy; `gs`, which
      uses Google Cloud Storage with OAuth2 tokens; and `ftp` or `sftp`, which
      use traditional file transfer protocols with negotiated credentials.


      Servers may return a subset of advertised methods based on file
      characteristics, for example they may choose to store large objects such
      as WGS BAM files in different backends to small csv files. Clients can
      request specific upload methods in the initial request.


      A client's request uses the same `upload_methods` structure, and the field
      is optional. By omitting it a client states no preference, leaving the
      server free to offer whatever methods it chooses. By including it a client
      expresses a preference for particular types, and may attach an
      `upload_details` object to each, mirroring the `upload_details` the server
      returns. This is why a request supplies structured `upload_methods` rather
      than a plain list of type names: it lets a client pass backend-specific
      information alongside its method choice. The server is not obliged to
      honour these preferences; it may offer a different method, and it may
      disregard `upload_details` it cannot apply, for example where it does not
      support the requested type for that file. As noted above, this structure
      is also what allows flows beyond the expected three phases. For example, a
      client that already holds the data in its own storage could request an
      `s3` method and use `upload_details` to point the server at the source,
      letting the server copy the bytes directly instead of issuing upload
      credentials:


      ```json

      {
        "requests": [
          {
            "name": "sample.bam",
            "size": 1073741824,
            "mime_type": "application/octet-stream",
            "checksums": [{ "checksum": "d41d8cd98f00b204e9800998ecf8427e", "type": "md5" }],
            "upload_methods": [
              {
                "type": "s3",
                "upload_details": {
                  "source_url": "s3://client-bucket/incoming/sample.bam"
                }
              }
            ]
          }
        ]
      }

      ```


      ## Related file storage


      Servers MAY support storing files from the same upload request under
      common prefixes, which helps bioinformatics workflows that expect
      co-located files such as a CRAM with its CRAI index, a VCF with its tabix
      index, or a compressed FASTQ with its associated reference data. A server
      advertises this with the `relatedFileStorageSupported` flag, and clients
      can also examine the upload URLs for common prefixes.


      ## Object registration


      After upload, clients can register files in bulk as DRS objects using POST
      `/objects/register`. Registration is all-or-nothing: if any candidate
      object fails to be registered, the entire request fails and no objects are
      registered. A server MAY instead perform partial registration with
      appropriate error reporting where atomic behaviour is not feasible.


      A candidate object must include complete metadata (name, size, checksums,
      and MIME type) and access methods pointing to the file locations, must
      carry valid authorization where required, and must not include fields that
      the DRS server manages itself, such as `id`, `self_uri`, or timestamps.


      Upon receipt of candidate objects for registration the server will create
      unique object IDs, add the created and updated timestamps, and return
      complete DRS objects. Note that the server is not obliged to retain the
      clients supplied `access_methods` and is free to move data to different
      locations/backends once the object is registered. This means that a server
      can choose to receive uploads in an untrusted "dropzone", with hard quotas
      and additional security, and then move them to more permanent storage once
      the DRS object is registered and any validation is successful. Clients
      SHOULD NOT cache the response from `/objects/register` as the
      `access_methods` may change after registration.


      The `/objects/register` endpoint can also be used independently to
      register existing data that is already stored in accessible locations,
      without using the `/upload-request` workflow. This is useful for
      registering pre-existing datasets or files uploaded through other means.
      Servers may choose only to support registration and not uploads, and
      should advertise this in `/service-info`


      ## Authentication and validation


      The upload and registration endpoints support GA4GH Passports, Basic auth,
      and Bearer tokens. Checksums are required for all files, using SHA-256,
      MD5, or any IANA-registered algorithm, and servers MAY validate checksums
      and file sizes as advertised in the service-info flags. A server does not
      validate MIME types against file content, so clients are responsible for
      supplying accurate MIME types.


      ## Error responses


      - `400`: invalid metadata.

      - `401`: authentication is required.

      - `403`: insufficient permissions.

      - `500`: storage is unavailable.

      - `503`: the server is at capacity.


      ## Credential scoping


      Implementers SHOULD scope upload credentials to the minimum permissions
      and duration necessary. Credentials should allow write access only to the
      specific upload URL or path provided, have the shortest practical
      expiration time, typically fifteen minutes to one hour, and where possible
      be restricted to the expected file size and content type. They should not
      grant broader storage access beyond the intended upload location. This
      principle of least privilege limits the exposure if credentials are
      compromised or misused.


      ## Example workflows


      ### Simple HTTPS upload


      Upload Request:


      ```http

      POST /upload-request

      Content-Type: application/json


      {
        "requests": [
          {
            "name": "variants.vcf",
            "size": 52428800,
            "mime_type": "text/plain",
            "checksums": [
              {
                "checksum": "5d41402abc4b2a76b9719d911017c592",
                "type": "md5"
              }
            ],
            "upload_methods": [{ "type": "https" }]
          }
        ]
      }

      ```


      Response:


      ```json

      {
        "responses": [
          {
            "name": "variants.vcf",
            "size": 52428800,
            "mime_type": "text/plain",
            "checksums": [
              {
                "checksum": "5d41402abc4b2a76b9719d911017c592",
                "type": "md5"
              }
            ],
            "upload_methods": [
              {
                "type": "https",
                "access_url": {
                  "url": "https://uploads.example.org/variants.vcf"
                },
                "upload_details": {
                  "post_url": {
                    "url": "https://uploads.example.org/presigned-upload?signature=FAKE_SIG",
                    "headers": ["Header1", "Header2"]
                  }
                }
              }
            ]
          }
        ]
      }

      ```


      Upload via HTTPS:


      ```bash

      # POST the file to the presigned POST URL as multipart form data

      curl -X POST
      "https://uploads.example.org/presigned-upload?signature=FAKE_SIG" -H
      "Header1" -H "Header2" \
        -F "file=@variants.vcf"
      ```


      Register DRS Object:


      ```http

      POST /objects/register

      Content-Type: application/json


      {
        "candidates": [
          {
            "name": "variants.vcf",
            "size": 52428800,
            "mime_type": "text/plain",
            "checksums": [
              {
                "checksum": "5d41402abc4b2a76b9719d911017c592",
                "type": "md5"
              }
            ],
            "access_methods": [
              {
                "type": "https",
                "access_url": {
                  "url": "https://uploads.example.org/variants.vcf"
                }
              }
            ],
            "description": "Variant calls in VCF format"
          }
        ]
      }

      ```


      Response:


      ```json

      {
        "objects": [
          {
            "id": "drs_obj_f6e5d4c3b2a1",
            "self_uri": "drs://drs.example.org/drs_obj_f6e5d4c3b2a1",
            "name": "variants.vcf",
            "size": 52428800,
            "mime_type": "text/plain",
            "created_time": "2024-01-15T10:45:00Z",
            "updated_time": "2024-01-15T10:45:00Z",
            "version": "1.0",
            "checksums": [
              {
                "checksum": "5d41402abc4b2a76b9719d911017c592",
                "type": "md5"
              }
            ],
            "access_methods": [
              {
                "type": "https",
                "access_url": {
                  "url": "https://uploads.example.org/variants.vcf"
                }
              }
            ],
            "description": "Variant calls in VCF format"
          }
        ]
      }

      ```


