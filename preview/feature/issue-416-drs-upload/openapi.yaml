  - name: Object Deletion
    description: >
      > Delete support is an optional extension to the DRS API. Not all DRS
      servers implement it, and clients should check `/service-info` for the
      relevant capability flags before attempting to use the delete endpoints.


      DRS delete functionality allows suitably authenticated clients to request
      that DRS objects are removed from the server and, optionally, that the
      server attempt to delete the underlying data. Because delete support is
      optional, servers operating in untrusted environments may choose not to
      support it at all, and servers should ensure that they trust the clients
      from whom they accept delete requests.


      Delete uses an HTTP `PUT` rather than `DELETE`, because GA4GH Passports
      are passed in a request body and `DELETE` does not reliably support
      request bodies across all HTTP infrastructure.


      The delete endpoints accept two independent parameters,
      `delete_object_metadata` and `delete_storage_data`, which control what is
      removed. Both default to the safest option, leaving data in place.


      ## Deleting object metadata


      The `delete_object_metadata` parameter controls whether the DRS object
      metadata record is permanently removed or preserved. It defaults to
      `false`.


      When `delete_object_metadata` is `false`, the server marks the object as
      deleted but preserves the metadata record, a mode known as soft deletion.
      Read and access requests for a soft-deleted object return `410 Gone` with
      a standard `Error` response body. This mode requires
      `metadataRetentionSupported` to be `true` in `/service-info`; a server
      that does not support metadata retention silently ignores the parameter
      and permanently deletes the metadata.


      When `delete_object_metadata` is `true`, the server permanently removes
      the metadata record. The object ID no longer resolves and cannot be
      recovered.


      ## Deleting underlying data


      The `delete_storage_data` parameter lets a client express a preference
      that the underlying data referred to by the deleted object is also
      removed. It defaults to `false`, leaving the underlying data in place. A
      server advertises whether it supports the parameter at all with the
      `deleteStorageDataSupported` flag.


      Servers are free to interpret the request as they choose. A server that
      attempts to honour it need not do so synchronously, and may, for example,
      register the file for later deletion or implement soft deletion with
      versioning. A server may also choose to confirm that no other DRS object
      refers to the same underlying data before deleting it. Where an object
      refers to data held in more than one backend, for example where it has
      multiple `access_methods`, the server may delete the data from all or only
      some of those backends. A server may also lack the permissions needed to
      delete the data, or encounter errors when it tries.


      For these reasons clients MUST NOT depend on the underlying data being
      deleted, even where the server advertises `deleteStorageDataSupported` and
      the client sets `delete_storage_data`. HTTP responses indicate metadata
      deletion status only, and storage deletion is always a best-effort
      attempt.


      ## Bulk deletion


      The `/objects/delete` endpoint deletes several objects in one request.
      Servers SHOULD treat this as an atomic transaction: if any object fails
      validation or deletion, the whole request fails, no objects are deleted,
      and no attempt is made to delete underlying storage for any object. A
      server MAY instead perform partial deletion with appropriate error
      reporting where atomic behaviour is not feasible. A successful bulk delete
      returns `204 No Content`, and the failure of an atomic request returns a
      `4xx` error and leaves all objects in place.


      ## Updating objects through delete and re-registration


      Rather than introducing separate update operations, which would complicate
      server implementation, a metadata-only delete combined with the
      `/objects/register` endpoint gives clients a way to update DRS metadata
      without affecting the underlying data. A client deletes the existing
      metadata and registers a new object with the corrected metadata. An
      object's `access_methods` and additional checksums can be changed while
      keeping the same DRS object ID, as described in the access method update
      and checksum addition sections, but any other change requires deletion and
      re-registration under a new ID. Where the DRS server controls the storage
      backend, this offers a convenient, vendor-neutral way for clients to
      update and delete both objects and their data.


      ## Service discovery


      A server advertises its delete capabilities in `/service-info`:


      ```json

      {
        "drs": {
          "deleteSupported": true,
          "maxBulkDeleteLength": 100,
          "deleteStorageDataSupported": true,
          "metadataRetentionSupported": true
        }
      }

      ```


      - `deleteSupported`: whether the server supports deletion.

      - `maxBulkDeleteLength`: the maximum number of objects in a single bulk
      delete request.

      - `deleteStorageDataSupported`: whether the server can attempt to delete
      underlying storage data.

      - `metadataRetentionSupported`: whether the server can preserve metadata
      after deletion, that is soft delete via `delete_object_metadata: false`.


      ## Examples


      A soft delete, preserving both the metadata record and the underlying
      storage, since both parameters default to `false`:


      ```bash

      curl -X PUT ".../objects/obj_123/delete" -H "Authorization: Bearer token"
      -d '{}'

      # Object returns 410 Gone on subsequent read and access requests

      ```


      A permanent delete of the metadata together with an attempt to delete the
      storage:


      ```bash

      curl -X PUT ".../objects/obj_456/delete" -H "Authorization: Bearer token"
      \
        -d '{"delete_object_metadata": true, "delete_storage_data": true}'
      ```


      A bulk delete, which is atomic:


      ```bash

      curl -X PUT ".../objects/delete" -d '{
        "bulk_object_ids": ["obj_1", "obj_2"],
        "passports": ["..."],
        "delete_object_metadata": true,
        "delete_storage_data": true
      }'

      # All objects are deleted, or none are

      ```


      GA4GH Passports may be supplied in the request body, and Bearer tokens in
      the `Authorization` header.


      ## Error responses


      - `400`: storage deletion is not supported, or the request parameters are
      invalid.

      - `403`: the client lacks permission for one or more objects in the
      request.

      - `404`: an object was not found, or the delete endpoints are not
      supported.

      - `413`: a bulk request exceeds `maxBulkDeleteLength`.
  - name: Access Method Update
    description: >
      > Access method updates are an optional extension to the DRS API. Not all
      DRS servers implement them, and clients should check `/service-info` for
      `accessMethodUpdateSupported` before attempting to use these endpoints.


      The access method update endpoints allow authorized clients to change how
      an existing DRS object can be accessed, without changing the object's core
      metadata such as its size, checksums, or name. This is useful when data is
      migrated between storage providers, when a mirror or an alternative
      protocol is added, or when a URL changes, in each case keeping the same
      DRS object ID.


      An update overwrites the existing access methods for an object. A client
      that wants to add an access method while keeping the existing ones should
      first retrieve the object's current access methods and include them in the
      update request alongside the new method.


      A single object is updated through `PUT
      /objects/{object_id}/access-methods`. Several objects can be updated
      together through `PUT /objects/access-methods`, which takes an `updates`
      array, each entry pairing an `object_id` with its new `access_methods`.
      Bulk updates are atomic: if any object fails, the whole request fails and
      none are updated.


      A server MAY validate that the new access methods point to the same data,
      for example by checking file availability, checksums, or content. This
      behaviour is advertised in the `validateAccessMethods` field in
      `/service-info`.


      ## Service discovery


      A server advertises its access method update capabilities in
      `/service-info`:


      ```json

      {
        "drs": {
          "accessMethodUpdateSupported": true,
          "maxBulkAccessMethodUpdateLength": 100,
          "validateAccessMethods": false
        }
      }

      ```


      - `accessMethodUpdateSupported`: whether the server supports access method
      updates.

      - `maxBulkAccessMethodUpdateLength`: the maximum number of objects in a
      single bulk update request.

      - `validateAccessMethods`: whether the server validates new access
      methods.


      ## Examples


      Updating the access methods of a single object, for example after
      migrating its data to a new bucket:


      ```bash

      curl -X PUT "https://drs.example.org/objects/obj_123/access-methods" \
        -H "Content-Type: application/json" \
        -d '{
          "access_methods": [
            {"type": "s3", "access_url": {"url": "s3://new-bucket/migrated/file.bam"}}
          ]
        }'
      ```


      Updating several objects atomically:


      ```bash

      curl -X PUT "https://drs.example.org/objects/access-methods" \
        -H "Content-Type: application/json" \
        -d '{
          "updates": [
            {"object_id": "obj_1", "access_methods": [{"type": "https", "access_url": {"url": "https://new-location.com/file1.bam"}}]},
            {"object_id": "obj_2", "access_methods": [{"type": "s3", "access_url": {"url": "s3://new-bucket/file2.vcf"}}]}
          ]
        }'
      ```


      GA4GH Passports may be supplied in the request body, and Bearer tokens in
      the `Authorization` header.


      ## Error responses


      - `400`: the access methods are invalid, or validation failed.

      - `401`: authentication is required.

      - `403`: the client lacks permission for one or more objects in the
      request.

      - `404`: an object was not found, or access method updates are not
      supported.

      - `413`: a bulk request exceeds `maxBulkAccessMethodUpdateLength`.
  - name: Checksum Additions
    description: >
      > Checksum addition is an optional extension to the DRS API. Not all DRS
      servers implement it, and clients should check `/service-info` for
      `checksumAdditionSupported` before attempting to use these endpoints.


      The checksum addition endpoints allow authorized clients to add further
      checksums to an existing DRS object. This is useful for a server that
      relies on a particular checksum type, such as SHA-256, where objects are
      not guaranteed to carry that checksum when they are created, for example
      where they are registered with an MD5 checksum only.


      These endpoints only add checksums. A client SHOULD NOT attempt to change
      the value of an existing checksum or to remove one, and a server MUST NOT
      change any existing checksum. If a client attempts to update an existing
      checksum the server's behaviour is implementation dependent: it MAY ignore
      the request, or MAY return a `4XX` error. If an incorrect checksum has
      been registered, the client should delete the existing DRS object, where
      the server supports deletion, and register a new object with the correct
      metadata. This ensures that a single DRS object ID always points to the
      same object.


      A single object is updated through `PUT /objects/{object_id}/checksums`.
      Several objects can be updated together through `PUT /objects/checksums`,
      which takes an `additions` array, each entry pairing an `object_id` with
      the `checksums` to add. Bulk additions are atomic: if any object fails,
      the whole request fails and none are updated. A server MAY validate that
      the new checksums match the underlying object, a behaviour advertised in
      the `validateChecksums` field in `/service-info`.


      ## Service discovery


      A server advertises its checksum addition capabilities in `/service-info`:


      ```json

      {
        "drs": {
          "checksumAdditionSupported": true,
          "maxBulkChecksumAdditionLength": 100,
          "validateChecksums": true
        }
      }

      ```


      - `checksumAdditionSupported`: whether the server supports checksum
      addition.

      - `maxBulkChecksumAdditionLength`: the maximum number of objects in a
      single bulk addition request.

      - `validateChecksums`: whether the server validates new checksums.


      ## Examples


      Adding a SHA-256 checksum to an object that was registered with an MD5
      checksum only:


      ```bash

      curl -X PUT "https://drs.example.org/objects/obj_123/checksums" \
        -H "Content-Type: application/json" \
        -d '{
          "checksums": [
            {"checksum": "2320831154385267afee81d0d837473280117763f4acd426b3735c37a0500482", "type": "sha256"}
          ]
        }'
      ```


      Adding checksums to several objects atomically:


      ```bash

      curl -X PUT "https://drs.example.org/objects/checksums" \
        -H "Content-Type: application/json" \
        -d '{
          "additions": [
            {"object_id": "obj_123", "checksums": [{"checksum": "2320831154385267afee81d0d837473280117763f4acd426b3735c37a0500482", "type": "sha256"}]},
            {"object_id": "obj_456", "checksums": [{"checksum": "23d50c6804a8b198f7fe4ff11d4518fb46d8d8d1337c6b9aa0fbad7bb90b3d32", "type": "sha256"}]}
          ]
        }'
      ```


      GA4GH Passports may be supplied in the request body, and Bearer tokens in
      the `Authorization` header.


      ## Error responses


      - `400`: the checksums are invalid, or validation failed.

      - `401`: authentication is required.

      - `403`: the client lacks permission for one or more objects in the
      request.

      - `404`: an object was not found, or checksum additions are not supported.

      - `413`: a bulk request exceeds `maxBulkChecksumAdditionLength`.
