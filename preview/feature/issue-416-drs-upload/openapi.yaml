paths:
  /service-info:
    get:
      summary: Retrieve information about this service
      description: >-
        Returns information about the DRS service along with stats pertaining to
        total object count and cumulative size in bytes.

        Also indicates whether the server supports optional upload and delete
        operations and which methods are available.


        Extends the

        [v1.0.0 GA4GH Service Info
        specification](https://github.com/ga4gh-discovery/ga4gh-service-info)

        as the standardized format for GA4GH web services to self-describe.


        According to the 

        [service-info type
        registry](https://github.com/ga4gh/TASC/blob/master/service-info/ga4gh-service-info.json)

        maintained by the [Technical Alignment Sub Committee
        (TASC)](https://github.com/ga4gh/TASC),

        a DRS service MUST have:
          * a `type.group` value of `org.ga4gh`
          * a `type.artifact` value of `drs`

        Example 1, a server with upload and delete capabilities:

        ```

        {
            "id": "com.example.drs",
            "description": "Serves data according to DRS specification",
            ...
            "type": {
                "group": "org.ga4gh",
                "artifact": "drs",
                "version": "1.5"
            }
            ...
            "drs":{
              "maxBulkRequestLength": 200,
              "objectCount": 774560,
              "totalObjectSize": 4018437188907752,
              "uploadRequestSupported": true,
              "objectRegistrationSupported": true,
              "supportedUploadMethodTypes": ["s3", "https", "gs"],
              "maxUploadSize": 5368709120,
              "maxUploadRequestLength": 50,
              "validateChecksums": true,
              "validateFileSizes": false,
              "relatedFileStorageSupported": true,
              "deleteSupported": true,
              "maxBulkDeleteLength": 100,
              "deleteStorageDataSupported": true
            }
        }

        ```


        Example 2, a read-only server with no upload or delete:

        ```

        {
            "id": "com.example.readonly-drs",
            "description": "Read-only DRS service",
            ...
            "type": {
                "group": "org.ga4gh",
                "artifact": "drs",
                "version": "1.5"
            }
            ...
            "drs":{
              "maxBulkRequestLength": 500,
              "objectCount": 1250000,
              "totalObjectSize": 8500000000000000
            }
        }

        ```


        Example 3, a server with metadata-only delete:

        ```

        {
            "id": "com.example.metadata-drs",
            "description": "DRS service with metadata-only delete",
            ...
            "type": {
                "group": "org.ga4gh",
                "artifact": "drs",
                "version": "1.5"
            }
            ...
            "drs":{
              "maxBulkRequestLength": 200,
              "objectCount": 500000,
              "totalObjectSize": 2500000000000000,
              "deleteSupported": true,
              "maxBulkDeleteLength": 50,
              "deleteStorageDataSupported": false
            }
        }

        ```


        See the [Service Registry Appendix](#tag/GA4GH-Service-Registry) for
        more information on how to register a DRS service with a service
        registry.
      operationId: GetServiceInfo
      responses:
        '200':
          $ref: '#/components/responses/200ServiceInfo'
        '500':
          $ref: '#/components/responses/500InternalServerError'
      tags:
        - Service Info
  /objects/{object_id}:
    options:
      summary: Get Authorization info about a DrsObject.
      security:
        - {}
      description: >-
        Returns a list of `Authorizations` that can be used to determine how to
        authorize requests to `GetObject` or `PostObject`.
      operationId: OptionsObject
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          $ref: '#/components/responses/200OkAuthorizations'
        '204':
          $ref: '#/components/responses/AuthorizationsNotSupported'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFoundDrsObject'
        '405':
          $ref: '#/components/responses/AuthorizationsNotSupported'
        '500':
          $ref: '#/components/responses/500InternalServerError'
      tags:
        - Objects
      x-swagger-router-controller: ga4gh.drs.server
    get:
      summary: Get info about a DrsObject.
      description: >-
        Returns object metadata, and a list of access methods that can be used
        to fetch object bytes.
      operationId: GetObject
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - $ref: '#/components/parameters/Expand'
      responses:
        '200':
          $ref: '#/components/responses/200OkDrsObject'
        '202':
          $ref: '#/components/responses/202Accepted'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFoundDrsObject'
        '500':
          $ref: '#/components/responses/500InternalServerError'
      tags:
        - Objects
      x-swagger-router-controller: ga4gh.drs.server
    post:
      summary: Get info about a DrsObject through POST'ing a Passport.
      description: >-
        Returns object metadata and a list of access methods that can be used to
        fetch object bytes. Method is a POST to accommodate a JWT GA4GH Passport
        sent in the request body in order to authorize access.

        To upload new files and register them as DRS objects, use the
        `/upload-request` endpoint  to obtain upload methods and temporary
        credentials, then use POST `/objects/register` endpoint  to register
        multiple objects at once. Note that upload functionality is optional and
        not all DRS  servers implement the upload endpoints.
      operationId: PostObject
      security:
        - PassportAuth: []
      responses:
        '200':
          $ref: '#/components/responses/200OkDrsObject'
        '202':
          $ref: '#/components/responses/202Accepted'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFoundAccess'
        '500':
          $ref: '#/components/responses/500InternalServerError'
      tags:
        - Objects
      x-swagger-router-controller: ga4gh.drs.server
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      requestBody:
        $ref: '#/components/requestBodies/PostObjectBody'
  /objects:
    options:
      summary: Get Authorization info about multiple DrsObjects.
      security:
        - {}
      description: >-
        Returns a structure that contains for each DrsObjects a list of
        `Authorizations` that can be used to determine how to authorize requests
        to `GetObject` or `PostObject` (or bulk equivalents).
      operationId: OptionsBulkObject
      responses:
        '200':
          $ref: '#/components/responses/200OkBulkAuthorizations'
        '204':
          $ref: '#/components/responses/AuthorizationsNotSupported'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFoundDrsObject'
        '405':
          $ref: '#/components/responses/AuthorizationsNotSupported'
        '413':
          $ref: '#/components/responses/413RequestTooLarge'
        '500':
          $ref: '#/components/responses/500InternalServerError'
      tags:
        - Objects
      x-swagger-router-controller: ga4gh.drs.server
    post:
      summary: Get info about multiple DrsObjects with an optional Passport(s).
      description: >-
        Returns an array of object metadata and access methods for the specified
