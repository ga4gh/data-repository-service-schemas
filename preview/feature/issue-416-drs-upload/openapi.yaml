      description: >-
        All DRS objects were successfully deleted. For bulk operations, this
        indicates that  the entire atomic transaction completed successfully -
        all requested objects have been  deleted. Storage data deletion (if
        requested) was attempted but success is not guaranteed.
    400BadRequestDelete:
      description: >-
        The delete request is malformed or contains unsupported parameters
        (e.g., delete_storage_data: true when server doesn't support storage
        data deletion).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unsupported_storage_deletion:
              summary: Storage data deletion not supported
              description: >-
                Client requested storage data deletion but server doesn't
                support it
              value:
                msg: >-
                  Server does not support storage data deletion. Set
                  delete_storage_data to false or omit the parameter.
                status_code: 400
            invalid_request_format:
              summary: Malformed request body
              description: Request body contains invalid JSON or missing required fields
              value:
                msg: >-
                  Invalid request body: bulk_object_ids is required for bulk
                  delete operations
                status_code: 400
            empty_object_list:
              summary: Empty object ID list
              description: Bulk delete request with empty object ID array
              value:
                msg: bulk_object_ids cannot be empty
                status_code: 400
