  - name: Motivation
    description: >
      <table style="width:100%">
        <tr>
          <td style="width:40%">
            Data sharing requires portable data, consistent with the FAIR data principles (findable, accessible, interoperable, reusable). Today’s researchers and clinicians are surrounded by potentially useful data, but often need bespoke tools and processes to work with each dataset. Today’s data publishers don’t have a reliable way to make their data useful to all (and only) the people they choose. And today’s data controllers are tasked with implementing standard controls of non-standard mechanisms for data access.
          </td>
          <td style="width:60%">
              <img src="/data-repository-service-schemas/public/img/figure1.png">
              <em>
                Figure 1: there’s an ocean of data, with many different tools to drink from it, but no guarantee that any tool will work with any subset of the data
              </em>
          </td>
        </tr>
      </table>


      <table style="width:100%">
        <tr>
          <td style="width:40%">
            We need a standard way for data producers to make their data available to data consumers, that supports the control needs of the former and the access needs of the latter. And we need it to be interoperable, so anyone who builds access tools and systems can be confident they’ll work with all the data out there, and anyone who publishes data can be confident it will work with all the tools out there.
          </td>
          <td style="width:60%">
              <img src="/data-repository-service-schemas/public/img/figure2.png">
              <em>
                Figure 2: by defining a standard Data Repository API, and adapting tools to use it, every data publisher can now make their data useful to every data consumer
              </em>
          </td>
        </tr>
      </table>


      <table style="width:100%">
        <tr>
          <td style="width:75%">
            We envision a world where:
            <ul>
              <li>
                there are many many <strong>data consumers</strong>, working in research and in care, who can use the tools of their choice to access any and all data that they have permission to see
              </li>
              <li>
                there are many <strong>data access tools</strong> and platforms, supporting discovery, visualization, analysis, and collaboration
              </li>
              <li>
                there are many <strong>data repositories</strong>, each with their own policies and characteristics, which can be accessed by a variety of tools
              </li>
              <li>
                there are many <strong>data publishing tools</strong> and platforms, supporting a variety of data lifecycles and formats
              </li>
              <li>
                there are many many <strong>data producers</strong>, generating data of all types, who can use the tools of their choice to make their data as widely available as is appropriate
              </li>
            </ul>
          </td>
          <td style="width:25%">
              <img src="/data-repository-service-schemas/public/img/figure3.png">
              <em>
                Figure 3: a standard Data Repository API enables an ecosystem of data producers and consumers
              </em>
          </td>
        </tr>
      </table>


      This spec defines a standard **Data Repository Service (DRS) API** (“the
      yellow box”), to enable that ecosystem of data producers and consumers.
      Our goal is that the only thing data consumers need to know about a data
      repo is *\"here’s the DRS endpoint to access it\"*, and the only thing
      data publishers need to know to tap into the world of consumption tools is
      *\"here’s how to tell it where my DRS endpoint lives\"*.


      ## Federation


      The world’s biomedical data is controlled by groups with very different
      policies and restrictions on where their data lives and how it can be
      accessed. A primary purpose of DRS is to support unified access to
      disparate and distributed data. (As opposed to the alternative centralized
      model of "let’s just bring all the data into one single data repository”,
      which would be technically easier but is no more realistic than “let’s
      just bring all the websites into one single web host”.)


      In a DRS-enabled world, tool builders don’t have to worry about where the
      data their tools operate on lives — they can count on DRS to give them
      access. And tool users only need to know which DRS server is managing the
      data they need, and whether they have permission to access it; they don’t
      have to worry about how to physically get access to, or (worse) make a
      copy of the data. For example, if I have appropriate permissions, I can
      run a pooled analysis where I run a single tool across data managed by
      different DRS servers, potentially in different locations.
  - name: Working With Compound Objects
    description: >
      ## Compound Objects


      The DRS API supports access to data objects, with each `DrsObject`
      representing a single opaque blob of bytes. Much content (e.g. VCF files)
      is well represented as a single atomic `DrsObject`. Some content, however
      (e.g. DICOM images) is best represented as a compound object consisting of
      a structured collection of atomic `DrsObject`s. In both cases, DRS isn't
      aware of the semantics of the objects it serves -- understanding those
      semantics is the responsibility of the applications that call DRS.


      Common examples of compound objects in biomedicine include:

      * BAM+BAI genomic reads, with a small index (the BAI object) to large data
      (the BAM object), each object using a well-defined file format.

      * DICOM images, with a contents object pointing to one or more raw image
      objects, each containing pixels from different aspects of a single logical
      biomedical image (e.g. different z-coordinates)

      * studies, with a single table of contents listing multiple objects of
      various types that were generated together and are meant to be processed
      together


      ## Best Practice: Manifests


      As with atomic objects, DRS applications and servers are expected to agree
      on the semantics of compound objects using non-DRS mechanisms. The
      recommended best practice for representing a particular compound object
      type is:

      1. Define a manifest file syntax, which contains the DRS IDs of the
      constituent atomic objects, plus type-specific information about the
      relationship between those constituents.
          * Manifest file syntax isn't prescribed by the spec, but we expect they will often be JSON files.
          * For example, for a BAM+BAI pair the manifest file could contain two key-value pairs mapping the type of each constituent file to its DRS ID.
      3. Make manifest objects and their constituent objects available using
      standard DRS mechanisms -- each object is referenced via its own DRS ID,
      just like any other atomic object.
          * For example, for a BAM+BAI pair, there would be three DRS IDs -- one for the manifest, one for the BAM, and one for the BAI.
      5. Document the expected client logic for processing compound objects of
      interest. This logic typically consists of using standard DRS mechanisms
      to fetch the manifest, parsing its syntax, extracting the DRS IDs of
      constituent objects, and using standard DRS mechanisms to fetch the
      constituents as needed.
          * In some cases the application will always want to fetch all of the constituents; in other cases it may want to initially fetch a subset, and only fetch the others on demand. For example, a DICOM image viewer may only want to fetch the layers that are being rendered.
  - name: Background Notes on DRS URIs
    description: >
      ## Design Motivation


      DRS URIs are aligned with the [FAIR data
      principles](https://www.nature.com/articles/sdata201618) and the [Joint
      Declaration of Data Citation
      Principles](https://www.nature.com/articles/sdata20182) — both
      hostname-based and compact identifier-based URIs provide globally unique,
      machine-resolvable, persistent identifiers for data.


      * We require all URIs to begin with `drs://` as a signal to humans and
      systems consuming these URIs that the response they will ultimately
      receive, after transforming the URI to a fetchable URL, will be a DRS JSON
      packet. This signal differentiates DRS URIs from the wide variety of other
      entities (HTML documents, PDFs, ontology notes, etc.) that can be
      represented by compact identifiers.

      * We support hostname-based URIs because of their simplicity and
      efficiency for server and client implementers.

      * We support compact identifier-based URIs, and the meta-resolver services
      of identifiers.org and n2t.net (Name-to-Thing), because of the wide
      adoption of compact identifiers in the research community. as detailed by
      [Wimalaratne et al (2018)](https://www.nature.com/articles/sdata201829) in
      "Uniform resolution of compact identifiers for biomedical data."
  - name: Compact Identifier-Based URIs
    description: >
      **Note: Identifiers.org/n2t.net API Changes**


      The examples below show the current API interactions with
      [n2t.net](https://n2t.net/e/compact_ids.html) and
      [identifiers.org](https://docs.identifiers.org/) which may change over
      time. Please refer to the documentation from each site for the most
      up-to-date information. We will make best efforts to keep the DRS
      specification current but DRS clients MUST maintain their ability to use
      either the identifiers.org or n2t.net APIs to resolve compact
      identifier-based DRS URIs.


      ## Registering a DRS Server on a Meta-Resolver


      See the documentation on the [n2t.net](https://n2t.net/e/compact_ids.html)
      and [identifiers.org](https://docs.identifiers.org/) meta-resolvers for
      adding your own compact identifier type and registering your DRS server as
      a resolver. You can register new prefixes (or mirrors by adding resource
      provider codes) for free using a simple online form. For more information
      see [More Background on Compact
      Identifiers](./more-background-on-compact-identifiers.html).


      ## Calling Meta-Resolver APIs for Compact Identifier-Based DRS URIs


      Clients resolving Compact Identifier-based URIs need to convert a prefix
      (e.g. “drs.42”) into a URL pattern. They can do so by calling either the
      identifiers.org or the n2t.net API, since the two meta-resolvers keep
      their mapping databases in sync.


      ### Calling the identifiers.org API as a Client


      It takes two API calls to get the URL pattern.


      1. The client makes a GET request to identifiers.org to find information
      about the prefix:


      ```

      GET
      https://registry.api.identifiers.org/restApi/namespaces/search/findByPrefix?prefix=drs.42

      ```


      This request returns a JSON structure including various URLs containing an
      embedded namespace id, such as:


      ```

      "namespace" : {
        "href":"https://registry.api.identifiers.org/restApi/namespaces/1234"
      }

      ```


      2. The client extracts the namespace id (in this example 1234), and uses
      it to make a second GET request to identifiers.org to find information
      about the namespace:


      ```

      GET
      https://registry.api.identifiers.org/restApi/resources/search/findAllByNamespaceId?id=1234

      ```


      This request returns a JSON structure including an urlPattern field, whose
      value is a URL pattern containing a ${id} parameter, such as:


      ```

      "urlPattern" : "https://drs.myexample.org/ga4gh/drs/v1/objects/{$id}"

      ```


      ### Calling the n2t.net API as a Client


      It takes one API call to get the URL pattern.


      The client makes a GET request to n2t.net to find information about the
      namespace. (Note the trailing colon.)


      ```

      GET https://n2t.net/drs.42:

      ```


      This request returns a text structure including a redirect field, whose
      value is a URL pattern containing an `$id` parameter, such as:


      ```

      redirect: https://drs.myexample.org/ga4gh/drs/v1/objects/$id

      ```


      ## Caching with Compact Identifiers


      Identifiers.org/n2t.net compact identifier resolver records do not change
      frequently. This reality is useful for caching resolver records and their
      URL patterns for performance reasons. Builders of systems that use compact
      identifier-based DRS URIs should cache prefix resolver records from
      identifiers.org/n2t.net and occasionally refresh the records (such as
      every 24 hours). This approach will reduce the burden on these community
      services since we anticipate many DRS URIs will be regularly resolved in
      workflow systems. Alternatively, system builders may decide to directly
      mirror the registries themselves, instructions are provided on the
      identifiers.org/n2t.net websites.


      ## Security with Compact Identifiers


      As mentioned earlier, identifiers.org/n2t.net performs some basic
      verification of new prefixes and provider code mirror registrations on
      their sites. However, builders of systems that consume and resolve DRS
      URIs may have certain security compliance requirements and regulations
      that prohibit relying on an external site for resolving compact
      identifiers. In this case, systems under these security and compliance
      constraints may wish to whitelist certain compact identifier resolvers
      and/or vet records from identifiers.org/n2t.net before enabling in their
      systems.


      ## Accession Encoding to Valid DRS IDs


      The compact identifier format used by identifiers.org/n2t.net does not
      percent-encode reserved URI characters but, instead, relies on the first
      ":" character to separate prefix from accession. Since these accessions
      can contain any characters, and characters like "/" will interfere with
      DRS API calls, you *must* percent encode the accessions extracted from DRS
      compact identifier-based URIs when using as DRS IDs in subsequent DRS GET
      requests. An easy way for a DRS client to handle this is to get the
      initial DRS object JSON response from whatever redirects the compact
      identifier resolves to, then look for the `self_uri` in the JSON, which
      will give you the correctly percent-encoded DRS ID for subsequent DRS API
      calls such as the `access` method.


      ## Additional Examples


      For additional examples, see the document [More Background on Compact
      Identifiers](./more-background-on-compact-identifiers.html).
  - name: Hostname-Based URIs
    description: >
      ## Encoding DRS IDs


      In hostname-based DRS URIs, the ID is always percent-encoded to ensure
      special characters do not interfere with subsequent DRS endpoint calls. As
      such, ":" is not allowed in the URI and is a convenient way of
      differentiating from a compact identifier-based DRS URI. Also, if a given
      DRS service implementation uses compact identifier accessions as their DRS
      IDs, they must be percent encoded before using them as DRS IDs in
      hostname-based DRS URIs and subsequent GET requests to a DRS service
      endpoint.
  - name: GA4GH Service Registry
    description: >
      The [GA4GH Service Registry API
      specification](https://github.com/ga4gh-discovery/ga4gh-service-registry)
      allows information about GA4GH-compliant web services, including DRS
      services, to be aggregated into registries and made available via a
      standard API. The following considerations should be followed when
      registering DRS services within a service registry.


      * The DRS service attributes returned by `/service-info` (i.e. `id`,
      `name`, `description`, etc.) should have the same values as the registry
      entry for that service.

      * The value of the `type` object's `artifact` property should be `drs`
      (i.e. the same as it appears in `service-info`)

      * Each entry in a Service Registry must have a `url`, indicating the base
      URL to the web service. For DRS services, the registered `url` must
      include everything up to

      the standardized `/ga4gh/drs/v1` path. Clients should be able to assume
      that:
          + Adding `/ga4gh/drs/v1/objects/{object_id}` to the registered `url` will hit the `DrsObject` endpoint
          + Adding `/ga4gh/drs/v1/service-info` to the registered `url` will hit the Service Info endpoint

      Example listing of a DRS API registration from a service registry's
      `/services` endpoint:


      ```

      [
          {
              "id": "com.example.drs",
              "name": "Example DRS API",
              "type": {
                  "group": "org.ga4gh",
                  "artifact": "drs",
                  "version": "1.5.0"
              },
              "description": "The Data Repository Service (DRS) API ...",
              "organization": {
                  "id": "com.example",
                  "name": "Example Company"
              },
              "contactUrl": "mailto:support@example.com",
              "documentationUrl": "https://docs.example.com/docs/drs",
              "createdAt": "2021-08-09T00:00:00Z",
              "updatedAt": "2021-08-09T12:30:00Z",
              "environment": "production",
              "version": "1.13.4",
              "url": "https://drs-service.example.com"
          }
      ]

      ```
  - name: Upload Requests and Object Registration
    description: >
      > Upload and object registration are optional DRS extensions. Clients
      should check `/service-info` for `uploadRequestSupported` and
      `objectRegistrationSupported` before attempting to use these endpoints.


      The DRS upload and object registration endpoints allow clients to
      negotiate with servers on mutually convenient storage backends and then
      register uploads as DRS objects. The expected flow has three phases:


      1. Request the upload locations by sending the file metadata to
      `/upload-request`, which returns the available upload methods and
      credentials.

      2. Upload the files to storage using those URLs and credentials and the
      storage provider's own upload mechanisms. DRS is not involved in this step
      at all; it simply enables clients and servers to agree on a mutually
      convenient storage service.

      3. Register the uploaded files as DRS objects by sending them to
      `/objects/register`.


      This approach separates storage service and credential negotiation from
      file transfer and object registration, supporting a vendor-neutral means
      of sharing data in a DRS network.


      This three-phase exchange is the expected flow, but the specification does
      not preclude others. Because both the request and the response carry a
      structured `upload_methods` field, with method-specific `upload_details`,
      clients and servers can negotiate other arrangements, for example a server
      performing a copy from a client-supplied location rather than the client
      uploading. Such alternative flows, and the shape and contents of
      `upload_details`, are deliberately left undefined here so the protocol can
      accommodate future data transfer patterns.


      The `/objects/register` endpoint can be used independently to register
      existing data without using the `/upload-request` endpoint, and servers
      can choose to only support object registration and not uploads by setting
      the `uploadRequestSupported` and `objectRegistrationSupported` flags
      appropriately in `/service-info`.


      Upload requests and object registration endpoints only support bulk
      requests to simplify implementation and reflect real-world usage patterns.
      Bioinformatics workflows often involve uploading multiple related files
      together (e.g., BAM and VCF files with their indices, or analysis result
      sets), making bulk operations a natural fit. Single files/objects are
      handled as lists with one element. Implementations of the
      `/objects/register` endpoint SHOULD implement transaction semantics so
      that either all of the objects included in the request are successfully
      registered or none of them are, and clients should be robust to this
      behaviour. Transaction semantics for the `/upload-request` are encouraged
      but not required due to the variety and complexity of data transfer
      technologies.


      The `/upload-request` endpoint need not result in any state being
      maintained on the DRS server (intermediate DRS object IDs etc.); in its
      simplest form it is just a means for a server to provide details of where
      a client can upload data, and the server should ensure that it trusts the
      client before providing such details (e.g. with appropriate authentication
      and authorisation before processing the request). This means that for such
      stateless implementations, if uploads fail and there is no later call to
      `/objects/register` there is no DRS state to manage, simplifying server
      implementation. Some upload methods MAY require the server to maintain
      transfer state (for example a server-performed copy from a client-supplied
      location); this specification does not preclude that.


      However, servers SHOULD ensure that any data from unsuccessful uploads
      (e.g. incomplete multi-part uploads) are cleaned up, for example by using
      lifecycle configuration in the backend storage. There is _no_ means of
      requiring that a client ultimately registers a DRS object pointing at data
      uploaded, and so servers should consider implementing some form of storage
      "garbage collection", a straightforward approach is to set a short
      lifecycle policy on the upload location and move uploaded data that is
      later registered as DRS objects to other locations, updating object
      `access_methods` accordingly. Servers should also implement some means of
      constraining upload size (quotas etc.) to protect against accidental or
      malicious unconstrained uploads. Servers can choose to validate that the
      uploads match the claimed object size when `/objects/register` is called,
      and should advertise this behaviour with the `validateFileSizes` flag in
      `/service-info`.


      The `/upload-request` endpoint can return one or more `upload_methods` of
      different types for each requested file, and backend specific details such
      as bucket names, object keys and credentials are supplied in a generic
      `upload_details` field. A straightforward implementation might return a
      single time-limited pre-signed POST URL as the `post_url` for an
      `upload_method` of type `https` which incorporates authentication into the
      URL, but because DRS is often used for large files such as BAMs and CRAMs
      this specification also supports more sophisticated upload approaches
      implemented by cloud storage backends such as multi-part uploads,
      automatic retries etc. The `upload_details` field can be used to include
      bucket names, keys and temporary credentials that can be used in native
      clients and SDKs. This offers a natural way to adapt this protocol to new
      storage technologies. Refer to the examples below for some suggested
      implementations.


      ## Service discovery


      Check `/service-info` for upload capabilities:


      ```json

      {
        "drs": {
          "uploadRequestSupported": true,
          "objectRegistrationSupported": true,
          "supportedUploadMethodTypes": ["s3", "https"],
          "maxUploadSize": 5368709120,
          "maxUploadRequestLength": 50,
          "maxRegisterRequestLength": 50,
          "validateChecksums": true,
          "validateFileSizes": false,
          "relatedFileStorageSupported": true
        }
      }

      ```


      Upload related fields:


      - `uploadRequestSupported`: Upload request operations available via
      `/upload-request`

      - `objectRegistrationSupported`: Object registration operations available
      via `/objects/register`

      - `supportedUploadMethodTypes`: Available storage backends  

      - `maxUploadSize`: File size limit (bytes)

      - `maxUploadRequestLength`: Files per request limit for upload requests

      - `maxRegisterRequestLength`: Candidate objects per request limit for
      registration

      - `validateChecksums`/`validateFileSizes`: Server validation behavior

      - `relatedFileStorageSupported`: Files from same upload request will be
      stored under common prefixes


      ## Upload methods


      Upon receipt of a request for an upload method for a specific file, the
      server will respond with an array of `upload_methods`, each with
      associated `type` and corresponding `upload_details` with upload
      locations, temporary credentials etc. These details are specific to
      backend implementations.


      Example storage backends include `https`, which returns presigned POST
      URLs for HTTP uploads; `s3`, which provides direct S3 upload with
      temporary AWS credentials scoped by an IAM session policy; `gs`, which
      uses Google Cloud Storage with OAuth2 tokens; and `ftp` or `sftp`, which
      use traditional file transfer protocols with negotiated credentials.


      Servers may return a subset of advertised methods based on file
      characteristics, for example they may choose to store large objects such
      as WGS BAM files in different backends to small csv files. Clients can
      request specific upload methods in the initial request.


      A client's request uses the same `upload_methods` structure, and the field
      is optional. By omitting it a client states no preference, leaving the
      server free to offer whatever methods it chooses. By including it a client
      expresses a preference for particular types, and may attach an
      `upload_details` object to each, mirroring the `upload_details` the server
      returns. This is why a request supplies structured `upload_methods` rather
      than a plain list of type names: it lets a client pass backend-specific
      information alongside its method choice. The server is not obliged to
      honour these preferences; it may offer a different method, and it may
      disregard `upload_details` it cannot apply, for example where it does not
      support the requested type for that file. As noted above, this structure
      is also what allows flows beyond the expected three phases. For example, a
      client that already holds the data in its own storage could request an
      `s3` method and use `upload_details` to point the server at the source,
      letting the server copy the bytes directly instead of issuing upload
      credentials:


      ```json

      {
        "requests": [
          {
            "name": "sample.bam",
            "size": 1073741824,
            "mime_type": "application/octet-stream",
            "checksums": [{ "checksum": "d41d8cd98f00b204e9800998ecf8427e", "type": "md5" }],
            "upload_methods": [
              {
                "type": "s3",
                "upload_details": {
                  "source_url": "s3://client-bucket/incoming/sample.bam"
                }
              }
            ]
          }
        ]
      }

      ```


      ## Related file storage


      Servers MAY support storing files from the same upload request under
      common prefixes, which helps bioinformatics workflows that expect
      co-located files such as a CRAM with its CRAI index, a VCF with its tabix
      index, or a compressed FASTQ with its associated reference data. A server
      advertises this with the `relatedFileStorageSupported` flag, and clients
      can also examine the upload URLs for common prefixes.


      ## Object registration


      After upload, clients can register files in bulk as DRS objects using POST
      `/objects/register`. Registration is all-or-nothing: if any candidate
      object fails to be registered, the entire request fails and no objects are
      registered. A server MAY instead perform partial registration with
      appropriate error reporting where atomic behaviour is not feasible.


      A candidate object must include complete metadata (name, size, checksums,
      and MIME type) and access methods pointing to the file locations, must
      carry valid authorization where required, and must not include fields that
      the DRS server manages itself, such as `id`, `self_uri`, or timestamps.


      Upon receipt of candidate objects for registration the server will create
      unique object IDs, add the created and updated timestamps, and return
      complete DRS objects. Note that the server is not obliged to retain the
      clients supplied `access_methods` and is free to move data to different
      locations/backends once the object is registered. This means that a server
      can choose to receive uploads in an untrusted "dropzone", with hard quotas
      and additional security, and then move them to more permanent storage once
      the DRS object is registered and any validation is successful. Clients
      SHOULD NOT cache the response from `/objects/register` as the
      `access_methods` may change after registration.


      The `/objects/register` endpoint can also be used independently to
      register existing data that is already stored in accessible locations,
      without using the `/upload-request` workflow. This is useful for
      registering pre-existing datasets or files uploaded through other means.
      Servers may choose only to support registration and not uploads, and
      should advertise this in `/service-info`


      ## Authentication and validation


      The upload and registration endpoints support GA4GH Passports, Basic auth,
      and Bearer tokens. Checksums are required for all files, using SHA-256,
      MD5, or any IANA-registered algorithm, and servers MAY validate checksums
      and file sizes as advertised in the service-info flags. A server does not
      validate MIME types against file content, so clients are responsible for
      supplying accurate MIME types.


      ## Error responses


      - `400`: invalid metadata.

      - `401`: authentication is required.

      - `403`: insufficient permissions.

      - `500`: storage is unavailable.

      - `503`: the server is at capacity.


      ## Credential scoping


      Implementers SHOULD scope upload credentials to the minimum permissions
      and duration necessary. Credentials should allow write access only to the
      specific upload URL or path provided, have the shortest practical
      expiration time, typically fifteen minutes to one hour, and where possible
      be restricted to the expected file size and content type. They should not
      grant broader storage access beyond the intended upload location. This
      principle of least privilege limits the exposure if credentials are
      compromised or misused.


      ## Example workflows


      ### Simple HTTPS upload


      Upload Request:


      ```http

      POST /upload-request

      Content-Type: application/json


      {
        "requests": [
          {
            "name": "variants.vcf",
            "size": 52428800,
            "mime_type": "text/plain",
            "checksums": [
              {
                "checksum": "5d41402abc4b2a76b9719d911017c592",
                "type": "md5"
              }
            ],
            "upload_methods": [{ "type": "https" }]
          }
        ]
      }

      ```


      Response:


      ```json

      {
        "responses": [
          {
            "name": "variants.vcf",
            "size": 52428800,
            "mime_type": "text/plain",
            "checksums": [
              {
                "checksum": "5d41402abc4b2a76b9719d911017c592",
                "type": "md5"
              }
            ],
            "upload_methods": [
              {
                "type": "https",
                "access_url": {
                  "url": "https://uploads.example.org/variants.vcf"
                },
                "upload_details": {
                  "post_url": {
                    "url": "https://uploads.example.org/presigned-upload?signature=FAKE_SIG",
                    "headers": ["Header1", "Header2"]
                  }
                }
              }
            ]
          }
        ]
      }

      ```


      Upload via HTTPS:


      ```bash

      # POST the file to the presigned POST URL as multipart form data

      curl -X POST
      "https://uploads.example.org/presigned-upload?signature=FAKE_SIG" -H
      "Header1" -H "Header2" \
        -F "file=@variants.vcf"
      ```


      Register DRS Object:


      ```http

      POST /objects/register

      Content-Type: application/json


      {
        "candidates": [
          {
            "name": "variants.vcf",
            "size": 52428800,
            "mime_type": "text/plain",
            "checksums": [
              {
                "checksum": "5d41402abc4b2a76b9719d911017c592",
                "type": "md5"
              }
            ],
            "access_methods": [
              {
                "type": "https",
                "access_url": {
                  "url": "https://uploads.example.org/variants.vcf"
                }
              }
            ],
            "description": "Variant calls in VCF format"
          }
        ]
      }

      ```


      Response:


      ```json

      {
        "objects": [
          {
            "id": "drs_obj_f6e5d4c3b2a1",
            "self_uri": "drs://drs.example.org/drs_obj_f6e5d4c3b2a1",
            "name": "variants.vcf",
            "size": 52428800,
            "mime_type": "text/plain",
            "created_time": "2024-01-15T10:45:00Z",
            "updated_time": "2024-01-15T10:45:00Z",
            "version": "1.0",
            "checksums": [
              {
                "checksum": "5d41402abc4b2a76b9719d911017c592",
                "type": "md5"
              }
            ],
            "access_methods": [
              {
                "type": "https",
                "access_url": {
                  "url": "https://uploads.example.org/variants.vcf"
                }
              }
            ],
            "description": "Variant calls in VCF format"
          }
        ]
      }

      ```


