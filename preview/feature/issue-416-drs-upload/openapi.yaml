        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFoundDrsObject'
        '500':
          $ref: '#/components/responses/500InternalServerError'
      security:
        - {}
        - BasicAuth: []
        - BearerAuth: []
        - PassportAuth: []
      tags:
        - Objects
  /objects/access-methods:
    put:
      summary: Bulk update access methods for multiple DRS objects
      description: >-
        Update the access methods of several DRS objects in a single atomic
        request. This is an optional endpoint that not all DRS servers
        implement.
      operationId: BulkUpdateAccessMethods
      requestBody:
        $ref: '#/components/requestBodies/BulkAccessMethodUpdateBody'
      responses:
        '200':
          $ref: '#/components/responses/200BulkAccessMethodUpdate'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFoundDrsObject'
        '413':
          $ref: '#/components/responses/413RequestTooLarge'
        '500':
          $ref: '#/components/responses/500InternalServerError'
      security:
        - {}
        - BasicAuth: []
        - BearerAuth: []
        - PassportAuth: []
      tags:
        - Objects
  /objects/{object_id}/checksums:
    put:
      summary: Add additional checksums for a DRS object
      description: >-
        Add checksums to a single DRS object. This is an optional endpoint that
        not all DRS servers implement.
      operationId: AddChecksums
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      requestBody:
        $ref: '#/components/requestBodies/ChecksumAdditionBody'
      responses:
        '200':
          $ref: '#/components/responses/200ChecksumAddition'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFoundDrsObject'
        '413':
          $ref: '#/components/responses/413RequestTooLarge'
        '500':
          $ref: '#/components/responses/500InternalServerError'
      security:
        - {}
        - BasicAuth: []
        - BearerAuth: []
        - PassportAuth: []
      tags:
        - Objects
  /objects/checksum/{checksum}:
    get:
      summary: Get DRS objects that are a match for the checksum.
      description: >-
        Returns an array of `DRSObjects` that match a given checksum.

        If the checksum type is not provided, the checksum check is done against
        all checksum types.
      operationId: GetObjectsByChecksum
      security:
        - PassportAuth: []
      parameters:
        - $ref: '#/components/parameters/Checksum'
      responses:
        '200':
          $ref: '#/components/responses/200OkDrsObjects'
        '202':
          $ref: '#/components/responses/202Accepted'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFoundDrsObject'
        '500':
          $ref: '#/components/responses/500InternalServerError'
      tags:
        - Objects
      x-swagger-router-controller: ga4gh.drs.server
  /objects/checksums:
    put:
      summary: Add additional checksums for multiple DRS objects
      description: >-
        Add checksums to several DRS objects in a single atomic request. This is
        an optional endpoint that not all DRS servers implement.
      operationId: BulkAddChecksums
      requestBody:
        $ref: '#/components/requestBodies/BulkChecksumAdditionBody'
      responses:
        '200':
          $ref: '#/components/responses/200BulkChecksumAddition'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFoundDrsObject'
        '413':
          $ref: '#/components/responses/413RequestTooLarge'
        '500':
          $ref: '#/components/responses/500InternalServerError'
      security:
        - {}
        - BasicAuth: []
        - BearerAuth: []
        - PassportAuth: []
      tags:
        - Objects
  /objects/{object_id}/delete:
    put:
      summary: Delete a DRS object (optional endpoint)
      description: >-
        Delete a single DRS object by ID. This is an optional endpoint that not
        all DRS servers implement.
      operationId: DeleteObject
      security:
        - {}
        - BasicAuth: []
        - BearerAuth: []
        - PassportAuth: []
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      requestBody:
        $ref: '#/components/requestBodies/DeleteBody'
      responses:
        '204':
          $ref: '#/components/responses/204DeleteSuccess'
        '400':
          $ref: '#/components/responses/400BadRequestDelete'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403ForbiddenDelete'
        '404':
          $ref: '#/components/responses/404NotFoundDelete'
        '500':
          $ref: '#/components/responses/500InternalServerError'
      tags:
        - Objects
      x-swagger-router-controller: ga4gh.drs.server
      x-codegen-request-body-name: body
  /objects/delete:
    put:
      summary: Delete multiple DRS objects
      description: >-
        Delete several DRS objects in a single atomic request. This is an
        optional endpoint that not all DRS servers implement.
      operationId: BulkDeleteObjects
      tags:
        - Objects
      requestBody:
        $ref: '#/components/requestBodies/BulkDeleteBody'
      responses:
        '204':
          $ref: '#/components/responses/204DeleteSuccess'
        '400':
          $ref: '#/components/responses/400BadRequestDelete'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403ForbiddenDelete'
        '404':
          $ref: '#/components/responses/404NotFoundDelete'
        '413':
          $ref: '#/components/responses/413RequestTooLarge'
        '500':
          $ref: '#/components/responses/500InternalServerError'
      security:
        - {}
        - BasicAuth: []
        - BearerAuth: []
        - PassportAuth: []
      x-codegen-request-body-name: body
  /upload-request:
    post:
      summary: Request upload methods for files
      description: >-
        Request upload methods and temporary credentials for one or more files,
        before registering them as DRS objects. This is an optional endpoint
        that not all DRS servers implement.
      operationId: PostUploadRequest
      security:
        - {}
        - BasicAuth: []
        - BearerAuth: []
        - PassportAuth: []
      requestBody:
        $ref: '#/components/requestBodies/UploadRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/200UploadRequest'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'
      tags:
        - Upload Request
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: >
        A valid authorization token must be passed in the 'Authorization'
        header,

        e.g. "Basic ${token_string}"
    BearerAuth:
      type: http
      scheme: bearer
      description: >-
        A valid authorization token must be passed in the 'Authorization'
        header, e.g. "Bearer ${token_string}"
    PassportAuth:
      type: http
      scheme: bearer
      x-in: body
      bearerFormat: JWT
      description: >-
        A valid GA4GH Passport must be passed in the body of an HTTP POST
        request as a tokens[] array.
  schemas:
    ServiceType:
      description: Type of a GA4GH service
      type: object
      required:
        - group
        - artifact
        - version
      properties:
        group:
          type: string
          description: >-
            Namespace in reverse domain name format. Use `org.ga4gh` for
            implementations compliant with official GA4GH specifications. For
            services with custom APIs not standardized by GA4GH, or
            implementations diverging from official GA4GH specifications, use a
            different namespace (e.g. your organization's reverse domain name).
          example: org.ga4gh
        artifact:
          type: string
          description: >-
            Name of the API or GA4GH specification implemented. Official GA4GH
            types should be assigned as part of standards approval process.
            Custom artifacts are supported.
          example: beacon
        version:
          type: string
          description: >-
            Version of the API or specification. GA4GH specifications use
            semantic versioning.
          example: 1.0.0
    Service:
      description: GA4GH service
      type: object
      required:
        - id
        - name
        - type
        - organization
        - version
      properties:
        id:
          type: string
          description: >-
            Unique ID of this service. Reverse domain name notation is
            recommended, though not required. The identifier should attempt to
            be globally unique so it can be used in downstream aggregator
            services e.g. Service Registry.
          example: org.ga4gh.myservice
        name:
          type: string
          description: Name of this service. Should be human readable.
          example: My project
        type:
          $ref: '#/components/schemas/ServiceType'
        description:
          type: string
          description: >-
            Description of the service. Should be human readable and provide
            information about the service.
          example: This service provides...
        organization:
          type: object
          description: Organization providing the service
          required:
            - name
            - url
          properties:
            name:
              type: string
              description: Name of the organization responsible for the service
              example: My organization
            url:
              type: string
              format: uri
              description: URL of the website of the organization (RFC 3986 format)
              example: https://example.com
        contactUrl:
          type: string
          format: uri
          description: >-
            URL of the contact for the provider of this service, e.g. a link to
            a contact form (RFC 3986 format), or an email (RFC 2368 format).
          example: mailto:support@example.com
        documentationUrl:
          type: string
          format: uri
          description: >-
            URL of the documentation of this service (RFC 3986 format). This
            should help someone learn how to use your service, including any
            specifics required to access data, e.g. authentication.
          example: https://docs.myservice.example.com
        createdAt:
          type: string
          format: date-time
          description: >-
            Timestamp describing when the service was first deployed and
            available (RFC 3339 format)
          example: '2019-06-04T12:58:19Z'
        updatedAt:
          type: string
          format: date-time
          description: >-
            Timestamp describing when the service was last updated (RFC 3339
            format)
          example: '2019-06-04T12:58:19Z'
        environment:
          type: string
          description: >-
            Environment the service is running in. Use this to distinguish
            between production, development and testing/staging deployments.
            Suggested values are prod, test, dev, staging. However this is
            advised and not enforced.
          example: test
        version:
          type: string
          description: >-
            Version of the service being described. Semantic versioning is
            recommended, but other identifiers, such as dates or commit hashes,
            are also allowed. The version should be changed whenever the service
            is updated.
          example: 1.0.0
    DrsService:
      type: object
      required:
        - type
        - maxBulkRequestLength
      properties:
        maxBulkRequestLength:
          type: integer
          description: >-
            DEPRECATED - In 2.0 this will move to under the drs section of
            service info and not at the root level. The max length the bulk
            request endpoints can handle (>= 1) before generating a 413 error
            e.g. how long can the arrays bulk_object_ids and
            bulk_object_access_ids be for this server.
        type:
          type: object
          required:
            - artifact
          properties:
            artifact:
              type: string
              enum:
                - drs
              example: drs
        drs:
          type: object
          required:
            - maxBulkRequestLength
          properties:
            maxBulkRequestLength:
              type: integer
              description: >-
                The max length the bulk request endpoints can handle (>= 1)
                before generating a 413 error e.g. how long can the arrays
                bulk_object_ids and bulk_object_access_ids be for this server.
            objectCount:
              type: integer
              description: The total number of objects in this DRS service.
            totalObjectSize:
              type: integer
              description: >-
                The total size of all objects in this DRS service in bytes.  As
                a general best practice, file bytes are counted for each unique
                file and not cloud mirrors or other redundant copies.
            uploadRequestSupported:
              type: boolean
              description: >-
                Indicates whether this DRS server supports upload request
                operations via the `/upload-request` endpoint. If true, clients
                can request upload methods and credentials for uploading files.
                If false or missing, the server does not support upload request
                coordination.
              default: false
            objectRegistrationSupported:
              type: boolean
              description: >-
                Indicates whether this DRS server supports object registration
                operations via the `/objects/register` endpoint. If true,
                clients can register uploaded files or existing data as DRS
                objects. If false or missing, the server does not support object
                registration.
              default: false
            supportedUploadMethodTypes:
              type: array
              items:
                type: string
              description: >-
                List of upload methods supported by this DRS server. Only
                present when uploadRequestSupported is true. Clients can use
                this information to determine which upload methods are available
                before making upload requests.

                This is an open list of strings rather than a fixed enumeration,
                so servers can advertise new or vendor-specific methods. Common
                values are `s3` for direct S3 upload with temporary AWS
                credentials, `gs` for Google Cloud Storage with access tokens,
                `https` for a presigned POST URL, `ftp` and `sftp` for file
                transfer protocols, `gsiftp` for GridFTP, and `globus` for the
                Globus transfer service.
            maxUploadSize:
              type: integer
              format: int64
              description: >-
                Maximum file size in bytes that can be uploaded via the upload
                endpoints. Only present when uploadRequestSupported is true. If
                not specified, there is no explicit size limit.
            maxUploadRequestLength:
              type: integer
              description: >-
                Maximum number of files that can be included in a single upload
                request. Only present when uploadRequestSupported is true. If
                not specified, defaults to the same value as
                maxBulkRequestLength.
            maxRegisterRequestLength:
              type: integer
              description: >-
                Maximum number of candidate objects that can be included in a
                single registration request. Only present when
                objectRegistrationSupported is true. If not specified, defaults
                to the same value as maxBulkRequestLength.
            validateChecksums:
              type: boolean
              description: >-
                Indicates whether this DRS server validates file checksums
                against the provided metadata. If true, the server will verify
                that uploaded and registered files match their declared
                checksums and may reject objects with mismatches. If false or
                missing, the server does not perform checksum validation and
                relies on client-provided metadata. Only present when at least
                one of uploadRequestSupported or objectRegistrationSupported or
                checksumAdditionSupported are true.
              default: false
            validateFileSizes:
              type: boolean
              description: >-
                Indicates whether this DRS server validates file sizes against
                the provided metadata. If true, the server will verify that
                uploaded files match their declared sizes and may reject uploads
                with mismatches. If false or missing, the server does not
                perform file size validation and relies on client-provided
                metadata. Only present when uploadRequestSupported or
                objectRegistrationSupported is true.
              default: false
            validateAccessMethods:
              type: boolean
              description: >-
                Indicates whether this DRS server validates access methods by
                following the URLs to check that they resolve to the expected
                objects  (e.g. by checking that the file sizes and checksums
                match) If true, the server will attempt to verify
                checksums/content before accepting access methods. If false or
                missing, the server trusts client-provided access methods
                without validation. Only present when at least one of
                objectRegistrationSupported or accessMethodUpdateSupported are
                true.
              default: false
            relatedFileStorageSupported:
              type: boolean
              description: >-
                Indicates whether this DRS server supports storing files from
                the same upload request under a common prefix or folder
                structure. If true, the server will organize related files
                together in storage, enabling bioinformatics workflows that
                expect co-located files (e.g., CRAM + CRAI, VCF + TBI). If false
                or missing, the server may distribute files across different
                storage locations or prefixes. Only present when
                uploadRequestSupported is true. This feature is particularly
                valuable for genomics tools like samtools that expect index
                files to be co-located with data files.
              default: false
            deleteSupported:
              type: boolean
              description: >-
                Indicates whether this DRS server supports delete operations via
                the delete endpoints. If true, clients can delete DRS objects
                using PUT requests to `/objects/{object_id}/delete` and
                `/objects/delete`. If false or missing, the server does not
                support delete operations and will return 404 for delete
                endpoint requests. Like upload functionality, delete support is
                entirely optional and servers remain DRS compliant without it.
              default: false
            maxBulkDeleteLength:
              type: integer
              description: >-
                Maximum number of objects that can be deleted in a single bulk
                delete request via `/objects/delete`. Only present when
                deleteSupported is true. If not specified when delete is
                supported, defaults to the same value as maxBulkRequestLength.
                Servers may enforce lower limits for delete operations compared
                to other bulk operations for safety reasons.
            deleteStorageDataSupported:
              type: boolean
              description: >-
                Indicates whether this DRS server supports attempting to delete
                underlying storage data when clients request it. If true, the
                server will attempt to delete both metadata and storage files
                when `delete_storage_data: true` is specified in delete
                requests. If false or missing, the server only supports metadata
                deletion regardless of client request, preserving underlying
                storage data. Only present when deleteSupported is true. This is
                a capability flag indicating what the server can attempt, not a
                default behavior setting. Note: Storage deletion attempts may
                fail due to permissions, network issues, or storage service
                errors.
              default: false
            metadataRetentionSupported:
              type: boolean
              description: >-
                Indicates whether this DRS server supports preserving object
                metadata after deletion. If true, the server honours
                `delete_object_metadata: false` in delete requests by marking
                the object as deleted rather than permanently removing it. Read
                and access endpoints return 410 Gone for objects in this state.
                Only present when deleteSupported is true.
              default: false
            accessMethodUpdateSupported:
              type: boolean
              description: >-
                Indicates whether this DRS server supports updating access
                methods for existing objects. If true, clients can update access
                methods using `/objects/{object_id}/access-methods` and
                `/objects/access-methods` endpoints. If false or missing, the
                server does not support access method updates.
              default: false
            maxBulkAccessMethodUpdateLength:
              type: integer
              description: >-
                Maximum number of objects that can be updated in a single bulk
                access method update request. Only present when
                accessMethodUpdateSupported is true. If not specified, defaults
                to maxBulkRequestLength.
            checksumAdditionSupported:
              type: boolean
              description: >-
                Indicates whether this DRS server supports adding new checksums
                for existing objects. If true, clients can add checksums using
                `/objects/{object_id}/checksums` and `/objects/checksums`
                endpoints. If false or missing, the server does not support
                checksum addition.
              default: false
            maxBulkChecksumAdditionLength:
              type: integer
              description: >-
                Maximum number of objects that can be updated in a single bulk
                checksum addition request. Only present when
                checksumAdditionSupported is true. If not specified, defaults to
                maxBulkRequestLength.
            fetchByChecksumSupported:
              type: boolean
              description: >-
                Indicates whether this DRS server supports fetching objects by
                checksum. If true, clients can fetch DRS objects using
                `/objects/checksum/{checksum}`, noting that it is possible for 
                multiple objects to have the same checksum. If false or missing,
                the server does not support fetching by checksum.
              default: false
    Error:
      type: object
      description: An object that can optionally include information about the error.
      properties:
        msg:
          type: string
          description: A detailed error message.
        status_code:
          type: integer
          description: The integer representing the HTTP status code (e.g. 200, 404).
    Checksum:
      type: object
      required:
        - checksum
        - type
      properties:
        checksum:
          type: string
          description: The hex-string encoded checksum for the data
        type:
          type: string
          description: >-
            The digest method used to create the checksum.

            The value (e.g. `sha-256`) SHOULD be listed as `Hash Name String` in
            the
            https://www.iana.org/assignments/named-information/named-information.xhtml#hash-alg[IANA
            Named Information Hash Algorithm Registry]. Other values MAY be
            used, as long as implementors are aware of the issues discussed in
            https://tools.ietf.org/html/rfc6920#section-9.4[RFC6920].

            GA4GH may provide more explicit guidance for use of
            non-IANA-registered algorithms in the future. Until then, if
            implementers do choose such an algorithm (e.g. because it's
            implemented by their storage provider), they SHOULD use an existing
            standard `type` value such as `md5`, `etag`, `crc32c`, `trunc512`,
            or `sha1`.
          example: sha-256
    AccessURL:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: >-
            A fully resolvable URL that can be used to fetch the actual object
            bytes.
        headers:
          type: array
          items:
            type: string
          description: >-
            An optional list of headers to include in the HTTP request to `url`.
            These headers can be used to provide auth tokens required to fetch
            the object bytes.
          example:
            - 'Authorization: Basic Z2E0Z2g6ZHJz'
    Authorizations:
      type: object
      properties:
        drs_object_id:
          type: string
        supported_types:
          type: array
          items:
            type: string
            enum:
              - None
              - BasicAuth
              - BearerAuth
              - PassportAuth
          description: >-
            An Optional list of support authorization types. More than one can
            be supported and tried in sequence. Defaults to `None` if empty or
            missing.
        passport_auth_issuers:
          type: array
          items:
            type: string
          description: >-
            If authorizations contain `PassportAuth` this is a required list of
            visa issuers (as found in a visa's `iss` claim) that may authorize
            access to this object. The caller must only provide passports that
            contain visas from this list. It is strongly recommended that the
            caller validate that it is appropriate to send the requested
            passport/visa to the DRS server to mitigate attacks by malicious DRS
            servers requesting credentials they should not have.
        bearer_auth_issuers:
          type: array
          items:
            type: string
          description: >-
            If authorizations contain `BearerAuth` this is an optional list of
            issuers that may authorize access to this object. The caller must
            provide a token from one of these issuers. If this is empty or
            missing it assumed the caller knows which token to send via other
            means. It is strongly recommended that the caller validate that it
            is appropriate to send the requested token to the DRS server to
            mitigate attacks by malicious DRS servers requesting credentials
            they should not have.
    AccessMethod:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - s3
            - gs
            - ftp
            - gsiftp
            - globus
            - htsget
            - https
            - file
          description: Type of the access method.
        access_url:
          allOf:
            - $ref: '#/components/schemas/AccessURL'
            - description: >-
                An `AccessURL` that can be used to fetch the actual object
                bytes. Note that at least one of `access_url` and `access_id`
                must be provided.
        access_id:
          type: string
          description: >-
            An arbitrary string to be passed to the `/access` method to get an
            `AccessURL`. This string must be unique within the scope of a single
            object. Note that at least one of `access_url` and `access_id` must
            be provided.
        cloud:
          type: string
          description: >-
            Name of the cloud service provider that the object belongs to. If
            the cloud service is Amazon Web Services, Google Cloud Platform or
            Azure the values should be `aws`, `gcp`, or `azure` respectively.
          example: aws, gcp, or azure
        region:
          type: string
          description: >-
            Name of the region in the cloud service provider that the object
            belongs to.
          example: us-east-1
        available:
          type: boolean
          description: >-
            Availability of file in the cloud. This label defines if this file
            is immediately accessible via DRS. Any delay or requirement of
            thawing mechanism if the file is in offline/archival storage is
            classified as false, meaning it is unavailable.
          example: true
        authorizations:
          allOf:
            - $ref: '#/components/schemas/Authorizations'
            - description: >-
                When `access_id` is provided, `authorizations` provides
                information about how to authorize the `/access` method.
    ContentsObject:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: >-
            A name declared by the bundle author that must be used when
            materialising this object, overriding any name directly associated
            with the object itself. The name must be unique within the
            containing bundle. This string is made up of uppercase and lowercase
            letters, decimal digits, hyphen, period, and underscore
            [A-Za-z0-9.-_]. See
            http://pubs.opengroup.org/onlinepubs/9699919799/basedefs/V1_chap03.html#tag_03_282[portable
            filenames].
        id:
          type: string
          description: >-
            A DRS identifier of a `DrsObject` (either a single blob or a nested
            bundle). If this ContentsObject is an object within a nested bundle,
            then the id is optional. Otherwise, the id is required.
        drs_uri:
          type: array
          description: >-
            A list of full DRS identifier URI paths that may be used to obtain
            the object. These URIs may be external to this DRS instance.
          example:
            - drs://drs.example.org/314159
          items:
            type: string
        contents:
          type: array
          description: >-
            If this ContentsObject describes a nested bundle and the caller
            specified "?expand=true" on the request, then this contents array
            must be present and describe the objects within the nested bundle.
          items:
            $ref: '#/components/schemas/ContentsObject'
    DrsObject:
      type: object
      required:
        - id
        - self_uri
        - size
        - created_time
        - checksums
      properties:
        id:
          type: string
          description: An identifier unique to this `DrsObject`
        name:
          type: string
          description: >-
            A string that can be used to name a `DrsObject`.

            This string is made up of uppercase and lowercase letters, decimal
            digits, hyphen, period, and underscore [A-Za-z0-9.-_]. See
            http://pubs.opengroup.org/onlinepubs/9699919799/basedefs/V1_chap03.html#tag_03_282[portable
            filenames].
        self_uri:
          type: string
          description: >-
            A drs:// hostname-based URI, as defined in the DRS documentation,
            that tells clients how to access this object.

            The intent of this field is to make DRS objects self-contained, and
            therefore easier for clients to store and pass around.  For example,
            if you arrive at this DRS JSON by resolving a compact
            identifier-based DRS URI, the `self_uri` presents you with a
            hostname and properly encoded DRS ID for use in subsequent `access`
            endpoint calls.
          example: drs://drs.example.org/314159
        size:
          type: integer
          format: int64
          description: >-
            For blobs, the blob size in bytes.

            For bundles, the cumulative size, in bytes, of items in the
            `contents` field.
        created_time:
          type: string
          format: date-time
          description: >-
            Timestamp of content creation in RFC3339.

            (This is the creation time of the underlying content, not of the
            JSON object.)
        updated_time:
          type: string
          format: date-time
          description: >-
            Timestamp of content update in RFC3339, identical to `created_time`
            in systems that do not support updates. (This is the update time of
            the underlying content, not of the JSON object.)
        version:
          type: string
          description: >-
            A string representing a version.

            (Some systems may use checksum, a RFC3339 timestamp, or an
            incrementing version number.)
        mime_type:
          type: string
          description: A string providing the mime-type of the `DrsObject`.
          example: application/json
        checksums:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Checksum'
          description: >-
            The checksum of the `DrsObject`. At least one checksum must be
            provided.

            For blobs, the checksum is computed over the bytes in the blob.

            For bundles, the checksum is computed over a sorted concatenation of
            the checksums of its top-level contained objects (not recursive,
            names not included). The list of checksums is sorted alphabetically
            (hex-code) before concatenation and a further checksum is performed
            on the concatenated checksum value.

            For example, if a bundle contains blobs with the following
            checksums:

            md5(blob1) = 72794b6d

            md5(blob2) = 5e089d29

            Then the checksum of the bundle is:

            md5( concat( sort( md5(blob1), md5(blob2) ) ) )

            = md5( concat( sort( 72794b6d, 5e089d29 ) ) )

            = md5( concat( 5e089d29, 72794b6d ) )

            = md5( 5e089d2972794b6d )

            = f7a29a04
        access_methods:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AccessMethod'
          description: >-
            The list of access methods that can be used to fetch the
            `DrsObject`.

            Required for single blobs; optional for bundles.
        contents:
          type: array
          description: >-
            If not set, this `DrsObject` is a single blob.

            If set, this `DrsObject` is a bundle containing the listed
            `ContentsObject` s (some of which may be further nested).
          items:
            $ref: '#/components/schemas/ContentsObject'
        description:
          type: string
          description: A human readable description of the `DrsObject`.
        aliases:
          type: array
          items:
            type: string
          description: >-
            A list of strings that can be used to find other metadata about this
            `DrsObject` from external metadata sources. These aliases can be
            used to represent secondary accession numbers or external GUIDs.
    summary:
      type: object
      description: A summary of what was resolved.
      properties:
        requested:
          type: integer
          description: Number of items requested.
        resolved:
          type: integer
          description: Number of objects resolved.
        unresolved:
          type: integer
          description: Number of objects not resolved.
    unresolved:
      type: array
      description: Error codes for each unresolved drs objects.
      items:
        type: object
        properties:
          error_code:
            type: integer
          object_ids:
            type: array
            items:
              type: string
    BulkObjectAccessId:
      type: object
      description: The object that contains object_id/access_id tuples
      properties:
        passports:
          type: array
          items:
            type: string
        bulk_object_access_ids:
          type: array
          items:
            type: object
            properties:
              bulk_object_id:
                type: string
                description: DRS object ID
              bulk_access_ids:
                type: array
                description: DRS object access ID
                items:
                  type: string
    BulkAccessURL:
      type: object
      required:
        - url
      properties:
        drs_object_id:
          type: string
        drs_access_id:
          type: string
        url:
          type: string
          description: >-
            A fully resolvable URL that can be used to fetch the actual object
            bytes.
        headers:
          type: array
          items:
            type: string
          description: >-
            An optional list of headers to include in the HTTP request to `url`.
            These headers can be used to provide auth tokens required to fetch
            the object bytes.
          example:
            - 'Authorization: Basic Z2E0Z2g6ZHJz'
    DrsObjectCandidate:
      type: object
      required:
        - size
        - checksums
      properties:
        name:
          type: string
          description: >-
            A string that can be used to name a `DrsObject`.

            This string is made up of uppercase and lowercase letters, decimal
            digits, hyphen, period, and underscore [A-Za-z0-9.-_]. See
            http://pubs.opengroup.org/onlinepubs/9699919799/basedefs/V1_chap03.html#tag_03_282[portable
            filenames].
        size:
          type: integer
          format: int64
          description: >-
            For blobs, the blob size in bytes.

            For bundles, the cumulative size, in bytes, of items in the
            `contents` field.
        version:
          type: string
          description: >-
            A string representing a version.

            (Some systems may use checksum, a RFC3339 timestamp, or an
            incrementing version number.)
        mime_type:
          type: string
          description: A string providing the mime-type of the `DrsObject`.
          example: application/json
        checksums:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Checksum'
          description: >-
            The checksum of the `DrsObject`. At least one checksum must be
            provided.

            For blobs, the checksum is computed over the bytes in the blob.

            For bundles, the checksum is computed over a sorted concatenation of
            the checksums of its top-level contained objects (not recursive,
            names not included). The list of checksums is sorted alphabetically
            (hex-code) before concatenation and a further checksum is performed
            on the concatenated checksum value.

            For example, if a bundle contains blobs with the following
            checksums:

            md5(blob1) = 72794b6d

            md5(blob2) = 5e089d29

            Then the checksum of the bundle is:

            md5( concat( sort( md5(blob1), md5(blob2) ) ) )

            = md5( concat( sort( 72794b6d, 5e089d29 ) ) )

            = md5( concat( 5e089d29, 72794b6d ) )

            = md5( 5e089d2972794b6d )

            = f7a29a04
        access_methods:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AccessMethod'
          description: >-
            The list of access methods that can be used to fetch the
            `DrsObject`.

            Required for single blobs; optional for bundles.
        contents:
          type: array
          description: >-
            If not set, this `DrsObject` is a single blob.

            If set, this `DrsObject` is a bundle containing the listed
            `ContentsObject` s (some of which may be further nested).
          items:
            $ref: '#/components/schemas/ContentsObject'
        description:
          type: string
          description: A human readable description of the `DrsObject`.
        aliases:
          type: array
          items:
            type: string
          description: >-
            A list of strings that can be used to find other metadata about this
            `DrsObject` from external metadata sources. These aliases can be
            used to represent secondary accession numbers or external GUIDs.
    AccessMethodUpdateRequest:
      type: object
      required:
        - access_methods
      properties:
        access_methods:
          type: array
          items:
            $ref: '#/components/schemas/AccessMethod'
          minItems: 1
          description: New access methods for the DRS object
        passports:
          type: array
          items:
            type: string
          description: Optional GA4GH Passport JWTs for authorization
    BulkAccessMethodUpdateRequest:
      type: object
      required:
        - updates
      properties:
        updates:
          type: array
          items:
            type: object
            required:
              - object_id
              - access_methods
            properties:
              object_id:
                type: string
                description: DRS object ID to update
              access_methods:
                type: array
                items:
                  $ref: '#/components/schemas/AccessMethod'
                minItems: 1
                description: New access methods for this object
          minItems: 1
          description: Array of access method updates to perform
        passports:
          type: array
          items:
            type: string
          description: Optional GA4GH Passport JWTs for authorization
    ChecksumAdditionRequest:
      type: object
      required:
        - checksums
      properties:
        checksums:
          type: array
          items:
            $ref: '#/components/schemas/Checksum'
          minItems: 1
          description: New checksums for the DRS object
        passports:
          type: array
          items:
            type: string
          description: Optional GA4GH Passport JWTs for authorization
    BulkChecksumAdditionRequest:
      type: object
      required:
        - additions
      properties:
        additions:
          type: array
          items:
            type: object
            required:
              - object_id
              - checksums
            properties:
              object_id:
                type: string
                description: DRS object ID to add checksum for
              checksums:
                type: array
                items:
                  $ref: '#/components/schemas/Checksum'
                minItems: 1
                description: New checksums for this object
          minItems: 1
          description: Array of checksum additions
        passports:
          type: array
          items:
            type: string
          description: Optional GA4GH Passport JWTs for authorization
    DeleteRequest:
      type: object
      description: Request body for single object delete operations
      properties:
        passports:
          type: array
          items:
            type: string
            example: >-
              eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJnYTRnaF9wYXNzcG9ydF92MSI6W119.JJ5rN0ktP0qwyZmIPpxmF_p7JsxAZH6L6brUxtad3CM
          description: >-
            the encoded JWT GA4GH Passport that contains embedded Visas.  The
            overall JWT is signed as are the individual Passport Visas.
        delete_storage_data:
          type: boolean
          default: false
          description: >-
            If true, the server attempts to delete the underlying storage data
            (follows server's deleteStorageDataSupported capability). If false
            (default), underlying storage data is preserved. This parameter is
            independent of delete_object_metadata and controls only the storage
            layer. Clients must explicitly set this to true to enable storage
            data deletion, ensuring intentional choice for this potentially
            destructive operation. Only applicable when the server advertises
            deleteSupported in service-info.
        delete_object_metadata:
          type: boolean
          default: false
          description: >-
            If true, permanently remove the DRS object metadata record. The
            object ID will no longer resolve and cannot be recovered. If false
            (default), the server marks the object as deleted but preserves the
            metadata record, enabling potential recovery. Read and access
            endpoints return 410 Gone for objects in this state. Servers that
            support this mode advertise metadataRetentionSupported in
            service-info. Only applicable when the server advertises
            deleteSupported in service-info. Servers that do not support
            metadata retention SHOULD silently ignore this parameter and
            permanently delete metadata regardless of the value provided.
    BulkDeleteRequest:
      type: object
      description: Request body for bulk delete operations
      required:
        - bulk_object_ids
      properties:
        bulk_object_ids:
          type: array
          items:
            type: string
          description: Array of DRS object IDs to delete
          example:
            - drs_object_123456
            - drs_object_789012
            - drs_object_345678
        passports:
          type: array
          items:
            type: string
            example: >-
              eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJnYTRnaF9wYXNzcG9ydF92MSI6W119.JJ5rN0ktP0qwyZmIPpxmF_p7JsxAZH6L6brUxtad3CM
          description: >-
            the encoded JWT GA4GH Passport that contains embedded Visas.  The
            overall JWT is signed as are the individual Passport Visas.
        delete_storage_data:
          type: boolean
          default: false
          description: >-
            If true, the server attempts to delete the underlying storage data
            (follows server's deleteStorageDataSupported capability). If false
            (default), underlying storage data is preserved. This parameter is
            independent of delete_object_metadata and controls only the storage
            layer. Clients must explicitly set this to true to enable storage
            data deletion, ensuring intentional choice for this potentially
            destructive operation. Only applicable when the server advertises
            deleteSupported in service-info.
        delete_object_metadata:
          type: boolean
          default: false
          description: >-
            If true, permanently remove the DRS object metadata record. The
            object ID will no longer resolve and cannot be recovered. If false
            (default), the server marks the object as deleted but preserves the
            metadata record, enabling potential recovery. Read and access
            endpoints return 410 Gone for objects in this state. Servers that
            support this mode advertise metadataRetentionSupported in
            service-info. Only applicable when the server advertises
            deleteSupported in service-info. Servers that do not support
            metadata retention SHOULD silently ignore this parameter and
            permanently delete metadata regardless of the value provided.
    UploadMethodRequest:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: >-
            A requested upload method type, which should match one of the types
            published by the server in the `supportedUploadMethodTypes` field of
            the `/service-info` response (for example `s3`, `https`, `gs`). This
            is intentionally an open string rather than an enumeration so that
            servers and clients can negotiate new or vendor-specific upload
            methods without a change to this specification.
        upload_details:
          type: object
          additionalProperties: true
          description: >-
            Optional, method-specific details supplied by the client for this
            upload method. This mirrors the server-supplied `upload_details`
            field of an `UploadMethod` in the response, but carries information
            flowing from the client to the server. The contents and structure
            depend on the upload method `type` and are deliberately
            unconstrained at the protocol level, so that a client can provide a
            backend with whatever it needs to complete a transfer (for example,
            a reference to a client-controlled source location, or temporary
            scoped credentials for a server-performed copy) without this
            specification having to enumerate them.
    UploadRequestObject:
      type: object
      required:
        - name
        - size
        - mime_type
        - checksums
      properties:
        name:
          type: string
          description: The name of the file to upload
        size:
          type: integer
          format: int64
          description: Size of the file in bytes
        mime_type:
          type: string
          description: MIME type of the file
        checksums:
          type: array
          items:
            $ref: '#/components/schemas/Checksum'
          minItems: 1
          description: Array of checksums for file integrity verification
        description:
          type: string
          description: Optional description of the file
        aliases:
          type: array
          items:
            type: string
          description: Optional array of alternative names for the file
        upload_methods:
          type: array
          items:
            $ref: '#/components/schemas/UploadMethodRequest'
          description: >-
            Optional array of requested upload methods. Each entry names a
            requested upload method `type` (which should match one published by
            the server in the `supportedUploadMethodTypes` field of the
            `/service-info` response) and MAY carry method-specific
            `upload_details` supplied by the client. Servers SHALL try to honour
            requests, but may not be able to offer the requested upload method
            for specific file types/sizes etc. The server MAY return a 400 error
            if it cannot honour the request, or MAY return an alternative
            supported upload method.
    UploadRequest:
      type: object
      required:
        - requests
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/UploadRequestObject'
          minItems: 1
          description: Array of upload requests for files
        passports:
          type: array
          items:
            type: string
          description: Optional array of GA4GH Passport JWTs for authorization
    UploadMethod:
      type: object
      required:
        - type
        - access_url
      properties:
        type:
          type: string
          description: >-
            Type of upload method, which should match one of the types published
            by the server in the `supportedUploadMethodTypes` field of the
            `/service-info` response. This is intentionally an open string
            rather than an enumeration so that servers and clients can negotiate
            new or vendor-specific upload methods without a change to this
            specification. Common values include `s3`, `gs`, `https`, `ftp`,
            `sftp`, `gsiftp` and `globus`. Implementations MAY support any
            subset of upload methods.

            The 'https' type can be used to return a presigned POST URL and is
            expected to be the most common implementation for typical file
            uploads. This method provides a simple HTTP POST interface that
            works with standard web clients.

            The 's3' type is primarily intended to support uploads of large
            files that want to take advantage of multipart uploads and automatic
            retries implemented in AWS libraries. This method provides direct
            access to S3-specific upload capabilities.

            Other common implementations include 'gs' for Google Cloud Storage
            and 'sftp' for secure FTP uploads.
        access_url:
          allOf:
            - $ref: '#/components/schemas/AccessURL'
            - description: >-
                An `AccessURL` that specifies where the file will be accessible
                after upload. This URL will be used as the access_url in the
                eventual DRS object, ensuring consistency between upload and
                retrieval operations. Note that the `upload_details` field may
                contain additional URLs, such as pre-signed POST URLs used to
                upload the file, which may not be the same as this `access_url`.
        region:
          type: string
          description: >-
            Cloud region for the upload location. Optional for non-cloud storage
            types.
          example: us-east-1
        upload_details:
          type: object
          additionalProperties: true
          description: >-
            A dictionary of storage provider specific configuration details that
            vary by upload method type. The contents and structure depend on the
            specific upload method being used.
    UploadResponseObject:
      type: object
      required:
        - name
        - size
        - mime_type
        - checksums
      properties:
        name:
          type: string
          description: The name of the file
        size:
          type: integer
          format: int64
          description: Size of the file in bytes
        mime_type:
          type: string
          description: MIME type of the file
        checksums:
          type: array
          items:
            $ref: '#/components/schemas/Checksum'
          minItems: 1
          description: Array of checksums for file integrity verification
        description:
          type: string
          description: Optional description of the file
        aliases:
          type: array
          items:
            type: string
          description: Optional array of alternative names
        upload_methods:
          type: array
          items:
            $ref: '#/components/schemas/UploadMethod'
          description: Available methods for uploading this file
    UploadResponse:
      type: object
      required:
        - responses
      properties:
        responses:
          type: array
          items:
            $ref: '#/components/schemas/UploadResponseObject'
          description: List of upload responses for the requested files
  responses:
    200ServiceInfo:
      description: Retrieve info about the DRS service
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Service'
              - $ref: '#/components/schemas/DrsService'
    500InternalServerError:
      description: An unexpected error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    200OkDrsObject:
      description: The `DrsObject` was found successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DrsObject'
    202Accepted:
      description: >
        The operation is delayed and will continue asynchronously. The client
        should retry this same request after the delay specified by Retry-After
        header.
      headers:
        Retry-After:
          description: >
            Delay in seconds. The client should retry this same request after
            waiting for this duration. To simplify client response processing,
            this must be an integral relative time in seconds. This value SHOULD
            represent the minimum duration the client should wait before
            attempting the operation again with a reasonable expectation of
            success. When it is not feasible for the server to determine the
            actual expected delay, the server may return a brief, fixed value
            instead.
          schema:
            type: integer
            format: int64
    400BadRequest:
      description: The request is malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    401Unauthorized:
      description: The request is unauthorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    403Forbidden:
      description: The requester is not authorized to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    404NotFoundDrsObject:
      description: The requested `DrsObject` wasn't found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    404NotFoundAccess:
      description: The requested `AccessURL` wasn't found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    200OkAuthorizations:
      description: '`Authorizations` were found successfully'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Authorizations'
    AuthorizationsNotSupported:
      description: '`Authorizations` are not supported for this object. Default to `None`.'
    200OkDrsObjects:
      description: The `DrsObjects` were found successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              summary:
                $ref: '#/components/schemas/summary'
              unresolved_drs_objects:
                $ref: '#/components/schemas/unresolved'
              resolved_drs_object:
                type: array
                items:
                  $ref: '#/components/schemas/DrsObject'
    413RequestTooLarge:
      description: The bulk request is too large.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            bulk_limit_exceeded:
              summary: Bulk delete limit exceeded
              description: >-
                Request contains more objects than server's maximum bulk delete
                limit
              value:
                msg: >-
                  Bulk delete request contains 150 objects but server maximum is
                  100. Check maxBulkDeleteLength in service-info.
                status_code: 413
            request_size_too_large:
              summary: Request payload too large
              description: The overall request payload exceeds server limits
              value:
                msg: Request payload size exceeds server limit of 1MB
                status_code: 413
    200OkBulkAuthorizations:
      description: '`Authorizations` were found successfully'
      content:
        application/json:
          schema:
            type: object
            properties:
              summary:
                $ref: '#/components/schemas/summary'
              unresolved_drs_objects:
                $ref: '#/components/schemas/unresolved'
              resolved_drs_object:
                type: array
                items:
                  $ref: '#/components/schemas/Authorizations'
    200OkAccess:
      description: The `AccessURL` was found successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccessURL'
    200OkAccesses:
      description: The `AccessURL` was found successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              summary:
                $ref: '#/components/schemas/summary'
              unresolved_drs_objects:
                $ref: '#/components/schemas/unresolved'
              resolved_drs_object_access_urls:
                type: array
                items:
                  $ref: '#/components/schemas/BulkAccessURL'
    201ObjectsCreated:
      description: >-
        DRS objects were successfully registered as an atomic transaction.
        Returns the complete DRS objects with server-minted IDs and timestamps.
        All candidate objects were validated and registered together - if any
        had failed, none would have been registered.
      content:
        application/json:
          schema:
            type: object
            required:
              - objects
            properties:
              objects:
                type: array
                items:
                  $ref: '#/components/schemas/DrsObject'
                description: >-
                  Array of registered DRS objects in the same order as the
                  candidates in the request
          examples:
            single_object_created:
              summary: Single object registered
              description: Response after registering one DRS object
              value:
                objects:
                  - id: drs_obj_a1b2c3d4e5f6
                    self_uri: drs://drs.example.org/drs_obj_a1b2c3d4e5f6
                    name: sample_data.vcf
